<script>
/* ===================== Protocolo (manual PEX v1.0) ===================== */
const EIXOS = [['atendimento','Atendimento'],['organizacao','Organização'],['auditoria','Auditoria'],['estrutura','Estrutura']];
const ESCALA = ['Crítico','Muito baixo','Abaixo','Adequado','Muito bom','Excelente'];
const SKUS = ['Balão','Slime','Livro','Haste','Chaveiro','Ovo de dinossauro','Água'];
const ST = {rascunho:['Em preenchimento',''],enviado:['Aguardando validação','info'],em_validacao:['Em validação','info'],acao_corretiva:['Ação corretiva','warn'],devolvida:['Devolvida ao auditor','warn'],validado:['Validado','ok'],encerrado:['Encerrado','ok']};
const CRIT = {critica:['Crítica','bad'],alta:['Alta','warn'],media:['Média',''],baixa:['Baixa','']};
const ACAO = {aberta:['Aberta','bad'],andamento:['Em andamento','warn'],resolvida:['Resolvida','ok']};
const AREAS = ['Líder do evento','Compras','Operações','Manutenção','Gestão PEX'];
const it = (id,t,d) => ({id,t,d});
const STEPS = [
  {k:'anonimo', t:'Cliente oculto', eixo:'atendimento',
   intro:'Chegue como cliente comum, sem se identificar. Observe o atendimento e aplique os cenários padronizados.',
   alerta:'Limite ético: não ofereça propina, não peça venda sem registro, não induza desvio de dinheiro, não crie armadilhas repetidas nem constranja colaboradores. Descreva respostas inadequadas de forma objetiva.',
   grupos:[
    {t:'Roteiro de avaliação comercial', itens:[
      it('at-acolhimento','Acolhimento','Cordialidade, atenção, tempo de resposta e apresentação profissional'),
      it('at-conhecimento','Conhecimento','Preços, duração, regras de uso, restrições, políticas de acesso e combos'),
      it('at-consultiva','Venda consultiva','Oferece combos adequados ao perfil e explica benefícios e diferenças'),
      it('at-ticket','Ticket médio','Apresenta alternativa de maior valor quando pertinente, sem pressão'),
      it('at-integridade','Integridade','Valores corretos, registro da venda, comprovante e pagamento')]},
    {t:'Cenários padronizados', itens:[
      it('cn-preco','Dúvida sobre preço','Pergunte opções de ingresso e diferenças entre combos'),
      it('cn-comparacao','Comparação','Qual combo compensa mais para um tempo ou grupo; confira o cálculo'),
      it('cn-pagamento','Pagamento','Troco, comprovante e meios de pagamento'),
      it('cn-regra','Pedido fora da regra','Peça educadamente uma exceção comum, sem insistir')]}]},
  {k:'identificacao', t:'Identificação', special:'identificacao'},
  {k:'exposicao', t:'Exposição',
   intro:'Fotografe a vitrine e todos os outros locais onde há produtos expostos.', extras:true,
   grupos:[{t:'Vitrine e exposição', itens:[
      it('ex-baloes','Balões','Presença, variedade, integridade, quantidade e disposição'),
      it('ex-livros','Livros','Organização, conservação, visibilidade e acesso'),
      it('ex-chaveiros','Chaveiros','Estado do expositor, quantidade, modelos e espaços vazios'),
      it('ex-slimes','Slimes e demais produtos','Identificação, apresentação, conservação e armazenamento')]}],
   fotos:[['f-vitrine','Vitrine — foto frontal ampla'],['f-pdv','Outros locais com produtos expostos']]},
  {k:'estoque', t:'Estoque', eixo:'auditoria', special:'estoque',
   intro:'Conte fisicamente cada produto, na vitrine e na reserva, e declare o que tem na loja. A comparação com o saldo do sistema é feita pela administração.',
   notaDica:'Avalie a contagem, a organização e a conservação do estoque. A conferência com o sistema é feita pela administração.',
   grupos:[{t:'Armazenamento', itens:[
      it('es-separacao','Separação por categoria/SKU','Identificação e acesso sem movimentação insegura'),
      it('es-locais','Locais de contagem','Vitrine, reserva e locais autorizados, sem dupla contagem'),
      it('es-avarias','Danificados, vencidos ou sem identificação','Registre e fotografe cada caso'),
      it('es-padrao','Padrão estético e organização','Produtos guardados com cuidado, limpos, empilhados com segurança e fáceis de achar')]}],
   fotos:[['f-armazenagem','Onde os produtos estão armazenados — visão geral'],['f-armazenagem-det','Como estão armazenados — detalhe das prateleiras e caixas']]},
  {k:'limpeza', t:'Limpeza', eixo:'organizacao',
   intro:'Registre a condição real no momento da visita. Sujeira conta em Organização; desgaste com risco vira ocorrência em Estrutura.',
   grupos:[{t:'Checklist de limpeza', itens:[
      it('lp-piso','Carpete e pisos','Sujeira, manchas, umidade, odores, desgaste e pontos soltos'),
      it('lp-moveis','Móveis e balcão','Poeira, manchas, resíduos e organização da recepção'),
      it('lp-computadores','Computadores e periféricos','Higiene e conservação aparente'),
      it('lp-lixeiras','Lixeiras','Conservação, capacidade, saco, odor e descarte'),
      it('lp-areas','Áreas internas e atrações','Resíduos, sujeira acumulada e materiais fora do lugar'),
      it('lp-apoio','Estoque e áreas de apoio','Circulação livre e materiais empilhados com segurança')]}],
   fotos:[['f-frente','Frente do evento'],['f-recepcao','Recepção'],['f-piso','Piso / carpete'],['f-internas','Áreas internas']],
   notaDica:'A nota de Organização cobre limpeza, vitrine, apresentação e armazenagem.', extras:true},
  {k:'estrutura', t:'Estrutura', eixo:'estrutura',
   intro:'Inspeção visual, sem desmontar nada. A aprovação visual não substitui inspeção técnica nem manutenção preventiva.', extras:true,
   alerta:'Perigo imediato (fio energizado acessível, estrutura instável, proteção rompida em área de queda, inflável perdendo sustentação): peça ao responsável para suspender o uso da área, acione a equipe técnica e registre ocorrência crítica. Não faça reparos nem testes elétricos.',
   grupos:[
    {t:'Frente, mobiliário e acessos', itens:[
      it('et-letreiro','Letreiro e fachada','Fixação, conservação, iluminação e acabamento'),
      it('et-recepcao','Recepção, baús e cadeiras','Estabilidade, integridade, quinas e peças danificadas'),
      it('et-cercados','Cercados do parque, portões e fechos','Bem fixados, alinhados, sem partes soltas; abertura e fechamento seguros'),
      it('et-emendas','Emendas e pontos de contato','Folgas, bordas, saliências e proteções ausentes')]},
    {t:'Proteções e atrações', itens:[
      it('et-redes','Redes de proteção','Tensão, fixação, rasgos, costuras, remendos e aberturas'),
      it('et-ferragens','Ferragens e partes metálicas','Espuma/isotubo e abraçadeiras, sem pontas cortantes'),
      it('et-escorregadores','Escorregadores e tobogãs','Alinhamento, firmeza, superfícies e fixações expostas'),
      it('et-torres','Torres','Montagem, proteções, redes e tensão aparente dos elásticos'),
      it('et-tuneis','Túneis de fitas','Costuras, rasgos e pontos de desprendimento'),
      it('et-piscina','Piscina de bolinhas','Nível, limpeza, bolinhas quebradas e dispersão'),
      it('et-tatames','Tatames da piscina de bolinhas','Bem fixados, sem frestas, rasgos ou bordas soltas'),
      it('et-fixacao','Fixação dos brinquedos','Brinquedos, painéis e estruturas bem presos ao piso ou à parede, sem balanço'),
      it('et-espumas','Espumas e protetores de quina','Presentes, inteiros e bem presos')]},
    {t:'Energia e tecnologia', itens:[
      it('et-eletrica','Instalações elétricas','Cabos aparentes, isolação, conexões improvisadas, tomadas e umidade'),
      it('et-quadro','Quadro de distribuição','Fechado, identificado, protegido e sem sinais de aquecimento'),
      it('et-pc','Computadores e sistema','Inicialização, sistema, monitor, teclado, mouse e conexão'),
      it('et-iluminacao','Iluminação','Lâmpadas funcionando, luminárias presas e sem fios soltos')]},
    {t:'Segurança', itens:[
      it('et-extintor','Extintor e saída de emergência','Extintor dentro da validade e acessível; saída sinalizada e desobstruída')]},
    {t:'Infláveis', inflaveis:true, itens:[
      it('if-superficie','Superfície','Rasgos, furos, costuras abertas e perda aparente de pressão'),
      it('if-tubos','Tubos e saídas de ar','Conexões firmes; saídas não usadas fechadas'),
      it('if-sopradores','Motores dos infláveis','Funcionando, sem ruído estranho, aquecimento ou fios expostos; ventilação livre'),
      it('if-caixas','Caixas de proteção','Integridade, fixação, ventilação e acesso restrito'),
      it('if-ancoragem','Ancoragens e afastamentos','Conforme manual do fabricante e capacidade de uso')]}]},
  {k:'ocorrencias', t:'Ocorrências', special:'ocorrencias'},
  {k:'envio', t:'Enviar', special:'envio'}
];
const ITEM_INDEX = {};
STEPS.forEach(s => (s.grupos||[]).forEach(g => g.itens.forEach(i => { ITEM_INDEX[i.id] = {...i, step:s.k, eixo:s.eixo||'organizacao', infl:!!g.inflaveis}; })));
const FOTO_INDEX = {};
STEPS.forEach(s => (s.fotos||[]).forEach(([id,t]) => FOTO_INDEX[id] = t));

/* ===================== Estado ===================== */
const S = {db:null, assets:null, user:null, me:{id:null, admin:false, write:null},
  eventos:new Map(), visitas:new Map(), val:new Map(), names:{}, loaded:{ev:false, vi:false, va:false},
  tab:'painel', edit:null, rep:null, saving:false, pending:false, fotoKey:null, filt:{q:'', fr:'all'}, vfilt:'minhas'};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const nf1 = x => x == null ? '—' : Number(x).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
const nfi = x => x == null ? '—' : Number(x).toLocaleString('pt-BR');
const p2 = n => String(n).padStart(2,'0');
const fdt = ms => { if(!ms) return '—'; const d = new Date(ms); return `${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fd = ms => { if(!ms) return '—'; const d = new Date(ms); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`; };
const fiso = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const rid = () => Math.random().toString(36).slice(2, 10);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const pill = (txt, cls) => `<span class="pill ${cls||''}">${esc(txt)}</span>`;
const idOf = p => 'b-' + p.replace(/[^a-zA-Z0-9_-]/g,'-');
const evName = slugId => (S.eventos.get(slugId)||{}).nome || slugId;
const who = id => S.names[id] || (id && id === S.me.id ? 'Você' : S.me.admin ? 'Auditor' : 'Administração PEX');

function getPath(o, p){ return p.split('.').reduce((a,k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); let a = o; ks.slice(0,-1).forEach(k => { if(a[k] == null || typeof a[k] !== 'object') a[k] = /^\d+$/.test(k) ? [] : {}; a = a[k]; }); a[ks[ks.length-1]] = v; }

let tt;
function toast(msg, tipo){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (tipo ? ' ' + tipo : ''); t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, tipo === 'bad' ? 6000 : 4200); }

/* ===================== Cálculos ===================== */
function notaN(v, k){ const n = v.notas && v.notas[k] && v.notas[k].n; return (n === 0 || (typeof n === 'number')) ? n : (n === 'na' ? 'na' : null); }
function indice(v){ const ns = EIXOS.map(([k]) => notaN(v,k)).filter(n => typeof n === 'number'); return ns.length ? Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*10)/10 : null; }
function statusOf(v){
  if(!v.enviadoEm) return 'rascunho';
  const w = S.val.get(v._id);
  if(!w || !w.status) return 'enviado';
  if(w.status === 'devolvida') return (v.enviadoEm > (w.em||0)) ? 'enviado' : 'devolvida';
  return w.status;
}
function acaoOf(vid, oc){ const w = S.val.get(vid); return (w && w.acoes && w.acoes[oc.id]) || {}; }
function ocAberta(vid, oc){ return (acaoOf(vid, oc).status || 'aberta') !== 'resolvida'; }
function situacao(v){
  const crit = (v.ocorrencias||[]).some(o => o.crit === 'critica' && ocAberta(v._id, o));
  if(crit) return 'Bloqueado';
  if(!['validado','encerrado'].includes(statusOf(v))) return 'Em análise';
  const i = indice(v); return i == null ? '—' : (i >= 3 ? 'Aprovado' : 'Reprovado');
}
const sitCls = s => s === 'Bloqueado' ? 'bad' : s === 'Aprovado' ? 'ok' : s === 'Reprovado' ? 'warn' : s === 'Em análise' ? 'info' : '';
function submetidas(){ return [...S.visitas.values()].filter(v => v.enviadoEm && statusOf(v) !== 'devolvida'); }
function ultimaPorEvento(){ const m = new Map(); submetidas().forEach(v => { const c = m.get(v.evento); if(!c || v.enviadoEm > c.enviadoEm) m.set(v.evento, v); }); return m; }
function reincidente(v, oc){
  if(!oc.item) return false;
  return submetidas().some(o => o._id !== v._id && o.evento === v.evento && (o.enviadoEm||0) < (v.enviadoEm||Date.now()) && (o.ocorrencias||[]).some(x => x.item === oc.item));
}
function aplicavel(v, itemId){ const i = ITEM_INDEX[itemId]; return !(i.infl && !v.temInflaveis); }

/* ===================== Inicialização ===================== */
async function init(){
  const perfil = await portao();
  if(!perfil) return;
  const {db, user, assets} = PEX.runtime(perfil);
  S.db = db; S.user = user; S.assets = assets; S.perfil = perfil;
  const me = await user.me(); S.me.id = me.id; S.me.admin = !!me.canEdit; S.me.write = await user.can('data.write');
  document.body.classList.add('logado');
  document.querySelectorAll('#btn-conta, .side-av').forEach(el => el.textContent = iniciais(perfil.nome || perfil.email));
  document.querySelectorAll('.side-nome').forEach(el => el.textContent = nomeCurto(perfil.nome || perfil.email));
  document.querySelectorAll('.side-papel').forEach(el => el.textContent = (PAPEL[perfil.papel] || [''])[0]);
  S.me.master = perfil.papel === 'master';
  document.querySelectorAll('[data-admin]').forEach(el => el.hidden = !S.me.admin);
  if(S.me.admin) contarPendentes();
  db.collection('eventos').onSnapshot(s => { S.eventos = new Map(s.docs.map(d => [d.id, d.data()])); S.loaded.ev = true; refresh(); }, e => toast('Erro ao carregar eventos: ' + e.code));
  db.collection('visitas').onSnapshot(s => { S.visitas = new Map(s.docs.map(d => [d.id, {...d.data(), _id:d.id}])); S.loaded.vi = true; resolveNames(); refresh(true); }, e => toast('Erro ao carregar visitas: ' + e.code));
  db.collection('validacoes').onSnapshot(s => { S.val = new Map(s.docs.map(d => [d.id, d.data()])); S.loaded.va = true; refresh(true); }, e => toast('Erro ao carregar validações: ' + e.code));
  route();
}
async function resolveNames(){
  if(!S.user) return;
  const ids = new Set();
  S.visitas.forEach(v => v.auditor && ids.add(v.auditor));
  S.val.forEach(w => (w.hist||[]).forEach(h => h.por && ids.add(h.por)));
  if(!ids.size) return;
  const ps = await S.user.profiles([...ids]);
  let ch = false;
  Object.values(ps).forEach(p => { const n = p.isMe ? (p.name ? p.name + ' (você)' : 'Você') : (p.name || ''); if(n && S.names[p.id] !== n){ S.names[p.id] = n; ch = true; } });
  if(ch) refresh(true);
}
function busy(){ const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#main').contains(a); }
function refresh(dataOnly){
  updateCounts();
  if(S.edit) return; // o editor é dono do seu rascunho
  if(S.rep){ if(!busy()) renderReport(); return; }
  if(dataOnly && busy()) return;
  if(S.tab === 'usuarios' && dataOnly) return;
  render();
}
function updateCounts(){
  const n = [...S.visitas.values()].filter(v => ['enviado','em_validacao'].includes(statusOf(v))).length;
  setCt('ct-val', n, S.me.admin && n);
}

/* ===================== Rotas ===================== */
function route(){
  if(S.edit && S.db){ clearTimeout(S.saveT); const e = S.edit; S.db.doc('visitas/' + e.id).set(clone(e.d)).catch(() => toast('A última alteração da visita não foi salva.')); }
  const h = location.hash.slice(1); S.tab = ['painel','visitas'].concat(S.me.admin ? ['validacao','usuarios'] : []).includes(h) ? h : 'painel'; S.edit = null; S.rep = null; render(); }
window.addEventListener('hashchange', route);
function go(tab){ if(location.hash.slice(1) === tab){ route(); } else location.hash = tab; }

function render(){
  document.body.classList.remove('side-over');
  document.body.classList.toggle('editing', !!S.edit);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === S.tab && !S.edit)));
  $('#foot-slot').innerHTML = '';
  if(S.edit) return renderEditor();
  if(S.rep) return renderReport();
  if(!S.loaded.ev || !S.loaded.vi){ return; }
  if(S.tab === 'painel') renderPainel();
  else if(S.tab === 'visitas') renderVisitas();
  else if(S.tab === 'usuarios') renderUsuarios();
  else renderValidacao();
}

  const aud = rows.filter(r => r.v);

    <section class="kpis" aria-label="Indicadores">

        <div style="text-align:right;display:grid;justify-items:end;gap:2px"><small>${admin ? 'Parques auditados' : 'Parques que visitei'}</small><b style="font-size:26px">${aud.length}<span style="font-size:15px;opacity:.7;font-weight:700"> / ${evs.length}</span></b><div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div></div>

    temInflaveis: e.inflaveis === true, itens:{}, notas:{}, fotosObr:{}, estoque: SKUS.map(s => ({sku:s, fixo:true, exposto:'', reserva:'', just:'', fotos:[]})), atendentes:[''], extras:{},

function editavel(v){ const st = statusOf(v); return (st === 'rascunho' || st === 'devolvida') && (v.auditor === S.me.id); }
function abrir(id){ const v = S.visitas.get(id); if(!v) return; if(editavel(v)) openEditor(id, v); else openReport(id); }

/* ===================== Editor da visita ===================== */
function openEditor(id, data){
  const d = clone(data); delete d._id;
  S.edit = {id, d, step: d.identificadoEm ? 2 : 0, err:null, salvo: null};
  render(); window.scrollTo(0,0);
}
function queueSave(){ clearTimeout(S.saveT); setSaved('Salvando…'); S.saveT = setTimeout(flush, 700); }
async function flush(){
  if(!S.edit) return;
  if(S.saving){ S.pending = true; return; }
  S.saving = true; const {id, d} = S.edit;
  try{ await S.db.doc('visitas/' + id).set(clone(d)); if(S.edit) S.edit.salvo = Date.now(); setSaved('Salvo ' + fdt(Date.now()).slice(6)); }
  catch(err){ setSaved('Não salvo'); toast(err && err.code === 'quota_exceeded' ? 'O banco do PEX está cheio. Avise a administração.' : 'Não foi possível salvar. Verifique a conexão; suas respostas continuam na tela.'); }
  S.saving = false; if(S.pending){ S.pending = false; flush(); }
}
function setSaved(t){ const el = $('#saved'); if(el){ el.textContent = t; el.className = 'saved' + (/Salvando/.test(t) ? ' busy' : /Não/.test(t) ? ' err' : ''); } }

function stepDone(d, s){
  if(s.special === 'identificacao') return !!d.identificadoEm;
  if(s.special === 'ocorrencias') return STEPS.filter(x => x.grupos || x.special === 'identificacao').every(x => stepDone(d, x)) && (d.ocorrencias||[]).every(o => (o.local||'').trim() && (o.desc||'').trim() && (o.crit !== 'critica' || o.comunicado));
  if(s.special === 'envio') return !!d.enviadoEm;
  const items = (s.grupos||[]).flatMap(g => g.itens).filter(i => aplicavel(d, i.id));
  const ok = items.every(i => d.itens[i.id] && d.itens[i.id].r);
  const nota = !s.eixo || (d.notas[s.eixo] && d.notas[s.eixo].n != null);
  const est = s.special !== 'estoque' || estoqueOk(d);
  if(s.fotos && !s.fotos.every(([id]) => (d.fotosObr[id]||[]).length)) return false;
  if(s.k === 'anonimo' && !atendentesOk(d)) return false;
  if(s.extras && !extrasOk(d, s.k)) return false;
  return ok && nota && est;
}

  const {d, step} = S.edit; const s = STEPS[step];
  const v = S.visitas.get(S.edit.id); const w = S.val.get(S.edit.id);
  const devolvida = v && statusOf({...v, _id:S.edit.id}) === 'devolvida';
  const done = STEPS.map(x => stepDone(d, x));
  $('#main').innerHTML = `<div class="stack">
    <div class="ed-top">

function stepBody(s, d){
  const n = STEPS.indexOf(s) + 1;
  let h = `<div class="step-h"><span class="num">${n}</span><div><h2>${s.t}</h2>${s.intro ? `<p class="note">${s.intro}</p>` : ''}</div></div>`;
  if(s.alerta) h += `<div class="banner ${s.k === 'estrutura' ? 'bad' : 'info'}">${ic(s.k === 'estrutura' ? 'alerta' : 'escudo')}<div>${s.alerta}</div></div>`;
  if(s.special === 'identificacao') return h + identBody(d);
  if(s.special === 'ocorrencias') return h + ocBody(d);
  if(s.special === 'envio') return h + envioBody(d);
  if(s.k === 'anonimo') h += atendentesBody(d);
  if(s.special === 'estoque') h += estoqueBody(d);
  if(s.k === 'estrutura') h += `<label class="chk card" style="padding:14px"><input type="checkbox" id="b-temInflaveis" data-b="temInflaveis" data-bool${d.temInflaveis ? ' checked' : ''} data-rerender><span><b>Este parque tem infláveis</b><br><span class="note">Inclui o módulo de infláveis na inspeção.</span></span></label>`;
  (s.grupos||[]).forEach(g => {
    if(g.inflaveis && !d.temInflaveis) return;
    h += `<div><div class="grp-t">${g.t}</div>${g.itens.map(i => itemBody(i, d)).join('')}</div>`;
  });
  if(s.fotos) h += `<div><div class="grp-t">Fotos obrigatórias</div><div class="req">${s.fotos.map(([id,t]) => { const fs = (d.fotosObr[id]||[]); return `<div class="req-i${fs.length ? ' done' : ''}"><span><span class="dot">${ic(fs.length ? 'check' : 'camera', 'sm')}</span>${t}</span>${photos('obr:' + id, fs, true)}</div>`; }).join('')}</div></div>`;

  if(s.eixo) h += notaBody(s, d);
  return h;
}

const CRIT_HINT = '<div class="banner info"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg><div><b>Crítica</b>: risco imediato de acidente, choque ou queda. <b>Alta</b>: desvio relevante sem perigo imediato. <b>Média</b>: impacto operacional moderado. <b>Baixa</b>: melhoria estética ou de padronização.</div></div>';

function aceite(d){
  const pend = [];
  const nr = []; const naSemJust = [];
  STEPS.forEach(s => (s.grupos||[]).forEach(g => g.itens.forEach(i => { if(!aplicavel(d,i.id)) return; const a = d.itens[i.id]; if(!a || !a.r) nr.push(i.t); else if(a.r === 'na' && !(a.obs||'').trim()) naSemJust.push(i.t); })));
  const fotosF = Object.keys(FOTO_INDEX).filter(k => !(d.fotosObr[k]||[]).length).map(k => FOTO_INDEX[k]);
  const notasF = EIXOS.filter(([k]) => { const n = d.notas[k]; return !n || n.n == null || !(n.j||'').trim(); }).map(e => e[1]);
  const estOk = estoqueOk(d);
  const extF = STEPS.filter(s => s.extras && !extrasOk(d, s.k)).map(s => s.t);
  const ocF = (d.ocorrencias||[]).filter(o => !(o.desc||'').trim() || !(o.local||'').trim());
  const critF = (d.ocorrencias||[]).filter(o => o.crit === 'critica' && !o.comunicado);
  return [
    ['Etapa anônima concluída antes da identificação', !!d.identificadoEm, 'Conclua a etapa de identificação.'],
    ['Todos os itens aplicáveis respondidos', !nr.length, nr.length + ' sem resposta: ' + nr.slice(0,4).join(', ') + (nr.length > 4 ? '…' : '')],
    ['N/A justificado', !naSemJust.length, 'Falta justificar: ' + naSemJust.join(', ')],
    ['Notas dos quatro eixos com justificativa', !notasF.length, 'Falta: ' + notasF.join(', ')],
    ['Nome completo de quem atendeu', atendentesOk(d), 'Informe na etapa Cliente oculto o nome completo da colaboradora que atendeu.'],
    ['Contagem de todos os produtos', estOk, 'Preencha Exposto e Reserva de todos os produtos (use 0 se não houver) e dê nome aos "Outros".'],
    ['Outros locais com nome, resposta e foto', !extF.length, 'Complete os outros locais em: ' + extF.join(', ')],
    ['Fotos obrigatórias', !fotosF.length, 'Faltam: ' + fotosF.join(', ')],
    ['Ocorrências com local e descrição', !ocF.length, ocF.length + ' ocorrência(s) incompleta(s).'],
    ['Ocorrências críticas comunicadas', !critF.length, 'Confirme a comunicação imediata das críticas.']
  ];
}

async function enviar(){
  const d = S.edit.d; if(!aceite(d).every(c => c[1])) return;
  d.enviadoEm = Date.now();

  try{ await S.db.doc('visitas/' + S.edit.id).set(clone(d)); const id = S.edit.id; S.edit = null; toast('Auditoria enviada para validação.', 'ok'); openReport(id); }
  catch(err){ d.enviadoEm = null; toast('Não foi possível enviar. Verifique a conexão e tente de novo.'); }

/* ===================== Fotos ===================== */
function fotoArr(key, ctx, create){
  const [t, k] = key.split(':');
  if(t === 'acao'){ const w = ctx; w.acoes = w.acoes || {}; w.acoes[k] = w.acoes[k] || {}; if(create) w.acoes[k].fotos = w.acoes[k].fotos || []; return w.acoes[k].fotos || []; }
  const d = ctx;
  if(t === 'item'){ d.itens[k] = d.itens[k] || {}; if(create) d.itens[k].fotos = d.itens[k].fotos || []; return d.itens[k].fotos || []; }
  if(t === 'obr'){ if(create) d.fotosObr[k] = d.fotosObr[k] || []; return d.fotosObr[k] || []; }
  if(t === 'est'){ const r = d.estoque[+k]; if(create) r.fotos = r.fotos || []; return r.fotos || []; }
  if(t === 'oc'){ const o = d.ocorrencias[+k]; if(create) o.fotos = o.fotos || []; return o.fotos || []; }
  if(t === 'ext'){ const [sk, j] = k.split('.'); const x = ((d.extras||{})[sk]||[])[+j]; if(!x) return []; if(create) x.fotos = x.fotos || []; return x.fotos || []; }
  return [];
}
async function compress(file){
  try{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const max = 1600; const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return b && b.size < file.size ? b : file;
  }catch(e){ return file; }
}
async function uploadFiles(files){
  const key = S.fotoKey; if(!key || !S.assets) return;
  const ctx = key.startsWith('acao:') ? S.rep && S.rep.w : S.edit && S.edit.d;
  if(!ctx) return;
  let n = 0;
  for(const f of files){
    n++; toast(`Enviando foto ${n} de ${files.length}…`);
    try{
      const b = await compress(f);
      const res = await S.assets.upload(b, {type: b.type || 'image/jpeg'});
      fotoArr(key, ctx, true).push(res.id);
    }catch(err){
      const c = err && err.code;
      toast(c === 'unsupported_type' ? 'Formato não aceito. Use JPG, PNG ou WEBP (no iPhone: Ajustes › Câmera › Formatos › Mais compatível).' : c === 'too_large' ? 'Foto acima de 20 MB.' : c === 'quota_or_state' ? 'O espaço de fotos do PEX está cheio. Avise a administração.' : c === 'rate_limited' ? 'Muitas fotos de uma vez. Aguarde um pouco e tente de novo.' : 'Não foi possível enviar a foto. Tente de novo.');
      break;
    }
  }
  if(key.startsWith('acao:')){ saveVal(); renderReport(); } else { queueSave(); keepScroll(renderEditor); }

async function setStatus(s){

  const now = Date.now();
  w.status = s; w.em = now; w.hist = w.hist || []; w.hist.push({s, em:now, por:S.me.id, obs: s === 'devolvida' ? w.obs : ''});

  try{ await S.db.doc('validacoes/' + S.rep.id).set(clone(w)); toast('Status: ' + ST[s][0] + '.'); }
  catch(err){ toast(err && err.code === 'invalid_argument' ? 'Só a administração do PEX pode mudar o status.' : 'Não foi possível salvar. Tente de novo.'); }

  const item = v => { const st = statusOf(v); const crit = (v.ocorrencias||[]).filter(o => o.crit === 'critica' && ocAberta(v._id,o)).length; return `<button type="button" class="vitem" data-act="ver-visita" data-id="${esc(v._id)}"><span class="t">${esc(evName(v.evento))}</span>${pill(ST[st][0], ST[st][1])}<span class="s"><span>${ic('user','sm')}${esc(quem(v))}</span><span>${ic('envio','sm')}${fdt(v.enviadoEm)}</span><span>Índice <b style="color:var(--ink)">${nf1(indice(v))}</b></span>${crit ? `<span style="color:var(--bad);font-weight:700">${ic('alerta','sm')}${crit} crítica(s)</span>` : ''}</span></button>`; };

  const acoes = []; submetidas().forEach(v => (v.ocorrencias||[]).forEach((o,i) => { const a = acaoOf(v._id,o); if((a.status||'aberta') !== 'resolvida') acoes.push({v, o, i, a}); }));
  const ordem = {critica:0, alta:1, media:2, baixa:3}; const hoje = new Date().toISOString().slice(0,10);

    ${bloco('Em validação', grp(['em_validacao']), 'Nenhuma auditoria em validação.')}
    ${bloco('Ação corretiva', grp(['acao_corretiva']), 'Nenhuma auditoria aguardando correção.')}
    <section class="stack tight"><div class="sec-t">Plano de ação em aberto <span class="n">${acoes.length}</span></div>
      <div class="vlist cols">${acoes.map(({v,o,i,a}) => { const venc = a.prazo && a.prazo < hoje; return `<button type="button" class="vitem" data-act="ver-visita" data-id="${esc(v._id)}" style="border-left:4px solid ${o.crit === 'critica' ? 'var(--bad)' : o.crit === 'alta' ? 'var(--warn)' : 'var(--line-2)'}">
        <span class="t">${esc(evName(v.evento))}</span>${pill(ACAO[a.status||'aberta'][0], ACAO[a.status||'aberta'][1])}
        <span class="s" style="color:var(--ink-2)">${esc(o.desc || 'Sem descrição')}</span>
        <span class="s">${pill(CRIT[o.crit][0], CRIT[o.crit][1])}${reincidente(v,o) ? pill('Reincidente','warn') : ''}<span class="mono">${esc(v.codigo)}-O${i+1}</span><span>${ic('user','sm')}${esc(a.resp || 'sem responsável')}</span><span style="${venc ? 'color:var(--bad);font-weight:700' : ''}">${ic('cal','sm')}${a.prazo ? fiso(a.prazo) + (venc ? ' · vencido' : '') : 'sem prazo'}</span></span>
      </button>`; }).join('') || `<div class="empty" style="grid-column:1/-1">Nenhuma ocorrência em aberto.</div>`}</div>
    </section>
    ${bloco('Devolvidas ao auditor', grp(['devolvida']), 'Nenhuma auditoria devolvida.')}

/* ===================== Eventos de interface ===================== */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'tab'){ go(b.dataset.v); }
  else if(a === 'novo'){ novaVisita(); }
  else if(a === 'abrir'){ abrir(b.dataset.id); }
  else if(a === 'ver-visita'){ if(ev.target.closest('input,select')) return; openReport(b.dataset.id); }
  else if(a === 'fechar'){ if(S.edit){ clearTimeout(S.saveT); await flush(); } S.edit = null; S.rep = null; render(); window.scrollTo(0,0); }
  else if(a === 'step' || a === 'prox' || a === 'ant'){
    const e = S.edit; const n = a === 'step' ? +b.dataset.i : e.step + (a === 'prox' ? 1 : -1);
    if(a === 'prox' && e.step === 0 && !e.d.identificadoEm){ e.step = 1; }
    else e.step = Math.max(0, Math.min(STEPS.length-1, n));
    renderEditor(); window.scrollTo(0,0);
  }
  else if(a === 'res'){ const d = S.edit.d; const id = b.dataset.item; d.itens[id] = d.itens[id] || {}; d.itens[id].r = b.dataset.v; queueSave(); keepScroll(renderEditor); }
  else if(a === 'nota'){ const d = S.edit.d; const k = b.dataset.eixo; d.notas[k] = d.notas[k] || {}; d.notas[k].n = b.dataset.v === 'na' ? 'na' : +b.dataset.v; queueSave(); keepScroll(renderEditor); }
  else if(a === 'identificar'){ S.edit.d.identificadoEm = Date.now(); queueSave(); keepScroll(renderEditor); }
  else if(a === 'est-add'){ S.edit.d.estoque.push({sku:'', outro:true, exposto:'', reserva:'', just:'', fotos:[]}); queueSave(); keepScroll(renderEditor); }
  else if(a === 'est-rm'){ S.edit.d.estoque.splice(+b.dataset.i, 1); queueSave(); keepScroll(renderEditor); }
  else if(a === 'oc-add'){
    const d = S.edit.d; const item = b.dataset.item;
    if(item && d.ocorrencias.some(o => o.item === item)){ S.edit.step = STEPS.findIndex(s => s.k === 'ocorrencias'); renderEditor(); window.scrollTo(0,0); return; }
    const inf = item ? ITEM_INDEX[item] : null;
    d.ocorrencias.push({id:'oc' + rid(), item: item || null, eixo: inf ? inf.eixo : 'estrutura', crit: inf && inf.step === 'estrutura' ? 'alta' : 'media', local:'', desc: inf ? inf.t + ': ' + ((d.itens[item]||{}).obs||'') : '', acao:'', comunicado:false, colab: inf && inf.step === 'anonimo' ? ((d.atendentes||[]).filter(Boolean)[0] || '') : '', fotos: inf ? [...((d.itens[item]||{}).fotos||[])] : []});
    queueSave();
    if(item){ toast('Ocorrência aberta. Complete os detalhes na etapa Ocorrências.'); keepScroll(renderEditor); } else { keepScroll(renderEditor); }
  }
  else if(a === 'oc-rm'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Toque de novo para remover'; setTimeout(() => { if(b.isConnected){ b.classList.remove('armed'); b.textContent = 'Remover'; } }, 4000); return; }
    S.edit.d.ocorrencias.splice(+b.dataset.i, 1); queueSave(); keepScroll(renderEditor);
  }
  else if(a === 'enviar'){ enviar(); }
  else if(a === 'foto'){ S.fotoKey = b.dataset.key; const fi = $('#file-in'); fi.value = ''; fi.click(); }
  else if(a === 'rmfoto'){
    const key = b.dataset.key; const isAcao = key.startsWith('acao:');
    const arr = fotoArr(key, isAcao ? S.rep.w : S.edit.d, true); const i = arr.indexOf(b.dataset.fid); if(i >= 0) arr.splice(i, 1);

const PAPEL = {pendente:['Aguardando liberação','warn'], auditor:['Auditor',''], admin:['Administração','info'], master:['Master','brand'], bloqueado:['Bloqueado','bad']};
let recuperando = false;

async function portao(){
  if(!window.PEX || !PEX.configurado){
    $('#main').innerHTML = `<div class="auth"><div><h1>Plataforma PEX</h1><p class="lead">O app ainda não está ligado ao banco de dados.</p></div>
      <div class="banner warn">Preencha <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> no arquivo <span class="mono">config.js</span> e publique de novo.</div></div>`;
    return null;
  }
  PEX.sb.auth.onAuthStateChange(ev => {
    if(ev === 'PASSWORD_RECOVERY'){ recuperando = true; telaNovaSenha(); }
    else if(ev === 'SIGNED_OUT'){ location.hash = ''; location.reload(); }
  });
  if(/type=recovery/.test(location.hash)) recuperando = true;
  for(;;){
    let perfil;
    try{ perfil = await PEX.perfilAtual(); }
    catch(e){ $('#main').innerHTML = `<div class="auth"><div class="banner bad">Não foi possível conectar à Plataforma PEX. Verifique a internet.</div><button class="btn pri" type="button" onclick="location.reload()">Tentar de novo</button></div>`; return null; }
    if(recuperando && perfil){ telaNovaSenha(); await new Promise(r => { window.__pexSenhaOk = r; }); recuperando = false; continue; }
    if(!perfil){ telaLogin('entrar'); await new Promise(r => { window.__pexEntrou = r; }); continue; }
    if(perfil.papel === 'pendente' || perfil.papel === 'bloqueado'){ telaAguardando(perfil); await new Promise(r => { window.__pexEntrou = r; }); continue; }
    return perfil;
  }
}

    <p class="note" id="s-err" role="alert" hidden></p><button class="btn pri block" type="submit">Salvar nova senha</button></form></div></div></div>`;

function msgAuth(e){
  const m = String((e && e.message) || '').toLowerCase();
  if(/invalid login credentials/.test(m)) return 'E-mail ou senha incorretos.';
  if(/email not confirmed/.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/already registered|already been registered/.test(m)) return 'Este e-mail já tem cadastro. Use "Já tenho acesso" ou "Esqueci a senha".';
  if(/password should be|at least 6/.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit|too many|security purposes/.test(m) && !/email rate limit/.test(m)) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  if(/email address .* is invalid|invalid email|unable to validate email/.test(m)) return 'Este e-mail foi recusado. Confira se está correto ou use outro endereço.';
  if(/email rate limit/.test(m)) return 'O servidor atingiu o limite de e-mails de confirmação. Avise a administração do PEX para liberar o seu acesso.';
  if(/signups? (are )?(disabled|not allowed)|email_provider_disabled/.test(m)) return 'O cadastro por e-mail está desligado no Supabase (Authentication › Sign In / Providers › Email). Avise a administração do PEX.';
  if(/not authorized|email address .* not authorized/.test(m)) return 'O Supabase não conseguiu enviar o e-mail de confirmação. A administração precisa desligar "Confirm email" no Supabase.';
  if(/error sending|smtp/.test(m)) return 'O Supabase não conseguiu enviar o e-mail. A administração precisa desligar "Confirm email" no Supabase.';
  if(/failed to fetch|network/.test(m)) return 'Sem conexão. Verifique a internet.';
  return 'Não foi possível concluir. Tente de novo.';
}

document.addEventListener('submit', async e => {
  const f = e.target;
  if(f.id === 'f-auth'){
    e.preventDefault();
    const modo = f.dataset.modo; const err = $('#a-err'); const btn = $('#a-btn');
    const email = $('#a-email').value.trim(); const senha = $('#a-senha') ? $('#a-senha').value : '';
    const nome = $('#a-nome') ? $('#a-nome').value.trim() : '';
    const falha = m => { err.textContent = m; err.hidden = false; err.style.color = 'var(--bad)'; btn.disabled = false; };
    if(!/^\S+@\S+\.\S+$/.test(email)) return falha('Digite um e-mail válido.');
    if(modo === 'criar' && nome.length < 3) return falha('Digite seu nome completo.');
    if(modo !== 'recuperar' && senha.length < 6) return falha('A senha precisa ter pelo menos 6 caracteres.');
    btn.disabled = true; err.hidden = true;
    try{
      if(modo === 'entrar'){ await PEX.entrar(email, senha); window.__pexEntrou && window.__pexEntrou(); }
      else if(modo === 'criar'){
        const r = await PEX.cadastrar(nome, email, senha);
        if(r && r.session){ window.__pexEntrou && window.__pexEntrou(); }
        else telaLogin('entrar', ['Cadastro criado. Abra o e-mail que enviamos para confirmar o endereço e depois entre aqui.', 'info']);
      }
      else { await PEX.recuperar(email); telaLogin('entrar', ['Se esse e-mail tiver cadastro, você vai receber um link para criar uma nova senha.', 'info']); }
    }catch(x){ console.warn('PEX auth', x); falha(msgAuth(x)); }
  }
  if(f.id === 'f-senha'){
    e.preventDefault();
    const s = $('#s-nova').value; const err = $('#s-err');
    if(s.length < 6){ err.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; err.hidden = false; return; }
    try{ await PEX.novaSenha(s); history.replaceState(null, '', location.pathname); toast('Senha alterada.'); window.__pexSenhaOk && window.__pexSenhaOk(); }
    catch(x){ err.textContent = msgAuth(x); err.hidden = false; }
  }
  if(f.id === 'f-eventos'){ e.preventDefault(); adicionarEventos(); }
});

document.addEventListener('click', async ev => {

async function adicionarEventos(){
  const linhas = $('#ev-lista').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(!linhas.length){ toast('Digite pelo menos um evento.'); return; }
  const btn = $('#btn-ev-add'); btn.disabled = true;
  let ordem = Math.max(0, ...[...S.eventos.values()].map(e => e.ordem || 0));
  let ok = 0, pulados = 0;
  for(const l of linhas){
    const [nome, franquia, infl] = l.split(';').map(s => (s || '').trim());
    if(!nome){ continue; }
    const id = slug(nome);
    if(!id || S.eventos.has(id)){ pulados++; continue; }
    const inf = /^s/i.test(infl || '') ? true : /^n/i.test(infl || '') ? false : null;
    try{ await S.db.doc('eventos/' + id).set({nome, franquia: franquia || '', inflaveis: inf, ordem: ++ordem}); ok++; }
    catch(e){ toast('Não foi possível adicionar "' + nome + '".'); break; }
  }
  btn.disabled = false;
  toast(`${ok} ${ok === 1 ? 'parque adicionado' : 'parques adicionados'}${pulados ? ` · ${pulados} já existia(m)` : ''}.`);
  if(ok){ S.cfgTab = 'parques'; render(); }
}

function revisaoBody(d){
  const pr = r => r === 'c' ? pill('Conforme','ok') : r === 'nc' ? pill('Não conforme','bad') : r === 'na' ? pill('N/A','') : pill('Sem resposta','warn');
  const linha = (t, dir, extra) => `<div class="rep-it"><span>${t}</span><span>${dir}</span>${extra || ''}</div>`;
  const blocos = STEPS.slice(0, -1).map((s, i) => {
    const ok = stepDone(d, s); const partes = []; let corpo = '';
    if(s.k === 'anonimo'){ const n = nomesAtend(d); corpo += linha('Atendido por', n.length ? `<b>${esc(n.join(', '))}</b>` : pill('Falta o nome','bad')); }
    if(s.special === 'identificacao'){
      partes.push(d.identificadoEm ? 'Identificado às ' + fdt(d.identificadoEm).slice(6) : 'Ainda não se identificou');
      corpo += linha('Identificação', d.identificadoEm ? fdt(d.identificadoEm) : pill('Pendente','bad')) + linha('Líder presente', esc(d.lider || '—'));
    }
    if(s.special === 'estoque'){
      const rows = (d.estoque||[]).filter(r => r.fixo || r.outro || r.sku);
      const contados = rows.filter(r => r.exposto !== '' && r.reserva !== '');
      partes.push(`${contados.length} de ${rows.length} produtos contados`);
      corpo += rows.map(r => { const f = (+r.exposto||0) + (+r.reserva||0); const cont = r.exposto !== '' && r.reserva !== ''; return linha(esc(r.sku || 'Produto sem nome'), cont ? `<b>${f}</b> <span class="muted">(${+r.exposto||0} exp. + ${+r.reserva||0} res.)</span>` : pill('Não contado','bad'), r.just ? `<span class="o">${esc(r.just)}</span>` : ''); }).join('');
    }
    if(s.grupos){
      const its = s.grupos.filter(g => !g.inflaveis || d.temInflaveis).flatMap(g => g.itens);
      const n = k => its.filter(x => (d.itens[x.id]||{}).r === k).length; const sem = its.length - n('c') - n('nc') - n('na');
      partes.push(`${n('c')} conforme · ${n('nc')} não conforme · ${n('na')} N/A${sem ? ` · ${sem} sem resposta` : ''}`);
      corpo += its.map(x => { const a = d.itens[x.id] || {}; return linha(x.t, pr(a.r), `${a.obs ? `<span class="o">${esc(a.obs)}</span>` : ''}${(a.fotos||[]).length ? `<span class="o">${a.fotos.length} foto(s)</span>` : ''}`); }).join('');
    }
    if(s.fotos){
      const f = s.fotos.filter(([id]) => (d.fotosObr[id]||[]).length).length; partes.push(`fotos ${f}/${s.fotos.length}`);
      corpo += s.fotos.map(([id, t]) => linha(t, (d.fotosObr[id]||[]).length ? pill((d.fotosObr[id]).length + ' foto(s)','ok') : pill('Falta foto','bad'))).join('');
    }
    if(s.extras){
      const ex = ((d.extras||{})[s.k]) || [];
      if(ex.length){ partes.push(`${ex.length} outro(s) local(is)`); corpo += ex.map(x => linha('Outro local: ' + esc(x.local || 'sem nome'), pr(x.r), `${x.obs ? `<span class="o">${esc(x.obs)}</span>` : ''}<span class="o">${(x.fotos||[]).length} foto(s)</span>`)).join(''); }
    }
    if(s.eixo){
      const nt = d.notas[s.eixo] || {}; const lb = EIXOS.find(e => e[0] === s.eixo)[1];
      partes.push(`nota ${nt.n == null ? '—' : nt.n === 'na' ? 'N/A' : nt.n}`);
      corpo += linha('Nota de ' + lb, nt.n == null ? pill('Sem nota','bad') : `<b>${nt.n === 'na' ? 'N/A' : nt.n + ' · ' + ESCALA[nt.n]}</b>`, `<span class="o">${nt.j ? esc(nt.j) : '<b style="color:var(--bad)">Falta a justificativa</b>'}</span>`);
    }
    if(s.special === 'ocorrencias'){
      const ocs = d.ocorrencias || [];
      partes.push(ocs.length ? `${ocs.length} ocorrência(s)` + (ocs.some(o => o.crit === 'critica') ? ` · ${ocs.filter(o => o.crit === 'critica').length} crítica(s)` : '') : 'Nenhuma ocorrência');
      corpo += ocs.map((o, k) => linha(`${esc(d.codigo)}-O${k+1} · ${esc(CATEG[o.eixo] || o.eixo)}`, pill(CRIT[o.crit][0], CRIT[o.crit][1]), `<span class="o">${esc(o.local || 'sem local')} — ${esc(o.desc || 'sem descrição')}${o.colab ? ` · colaboradora: ${esc(o.colab)}` : ''}</span>`)).join('') || '<p class="note">Nenhuma ocorrência registrada.</p>';
    }
    return `<details class="fold rev${ok ? '' : ' pend'}"><summary><span class="num">${ok ? '✓' : '!'}</span><span style="min-width:0;flex:1">${i+1}. ${s.t}<small>${partes.join(' · ')}</small></span>${ic('down')}</summary>
      <div class="fold-b">${corpo}<div style="margin-top:10px"><button type="button" class="btn sm" data-act="step" data-i="${i}">${ic('left','sm')}Voltar para esta etapa</button></div></div></details>`;
  });
  return `<div><div class="grp-t">Revise o que você registrou</div>
    <p class="note" style="margin:-4px 0 10px">Toque em cada etapa para conferir tudo o que foi preenchido. As marcadas com <b style="color:var(--bad)">!</b> têm algo faltando.</p>
    <div class="stack tight">${blocos.join('')}</div></div>`;
}

  const b = ev.target.closest('[data-act]');
  if(b && b.dataset.act === 'side-toggle'){
    if(ehTablet()) document.body.classList.toggle('side-over');
    else { const min = !document.body.classList.contains('side-c'); try{ localStorage.setItem('pex-side', min ? 'min' : 'max'); }catch(e){} }
    aplicarSide(); return;
  }
  if(b && b.dataset.act === 'cfg-tab'){ S.cfgTab = b.dataset.v; renderUsuarios(); return; }
  if(document.body.classList.contains('side-over') && !ev.target.closest('.side')){ document.body.classList.remove('side-over'); aplicarSide(); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && document.body.classList.contains('side-over')){ document.body.classList.remove('side-over'); aplicarSide(); } });
document.addEventListener('input', e => { const t = e.target; if(t.dataset && t.dataset.pq !== undefined){ S.pq = t.value; const pos = t.selectionStart; renderUsuarios(); const n = $('#pq'); if(n){ n.focus(); n.setSelectionRange(pos, pos); } } });

init();
</script>
