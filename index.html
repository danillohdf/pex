<script>
/* ===================== Protocolo (manual PEX v1.0) ===================== */
const EIXOS = [['atendimento','Atendimento'],['organizacao','Organização'],['auditoria','Auditoria'],['estrutura','Estrutura']];
const ESCALA = ['Crítico','Muito baixo','Abaixo','Adequado','Muito bom','Excelente'];
const SKUS = ['Balão','Slime','Livro','Haste','Chaveiro','Ovo de dinossauro','Água'];
const ST = {rascunho:['Em preenchimento',''],enviado:['Aguardando validação','info'],em_validacao:['Em validação','info'],acao_corretiva:['Ação corretiva','warn'],devolvida:['Devolvida ao auditor','warn'],validado:['Validado','ok'],encerrado:['Encerrado','ok']};
const CRIT = {critica:['Crítica','bad'],alta:['Alta','warn'],media:['Média',''],baixa:['Baixa','']};
const ACAO = {aberta:['Aberta','bad'],andamento:['Em andamento','warn'],resolvida:['Resolvida','ok']};
const AREAS = ['Líder do evento','Compras','Operações','Manutenção','Gestão PEX'];
const it = (id,t,d) => ({id,t,d});
const STEPS = [
  {k:'anonimo', t:'Cliente oculto', eixo:'atendimento',
   intro:'Chegue como cliente comum, sem se identificar. Observe o atendimento e aplique os cenários padronizados.',
   alerta:'Limite ético: não ofereça propina, não peça venda sem registro, não induza desvio de dinheiro, não crie armadilhas repetidas nem constranja colaboradores. Descreva respostas inadequadas de forma objetiva.',
   grupos:[
    {t:'Roteiro de avaliação comercial', itens:[
      it('at-acolhimento','Acolhimento','Cordialidade, atenção, tempo de resposta e apresentação profissional'),
      it('at-conhecimento','Conhecimento','Preços, duração, regras de uso, restrições, políticas de acesso e combos'),
      it('at-consultiva','Venda consultiva','Oferece combos adequados ao perfil e explica benefícios e diferenças'),
      it('at-ticket','Ticket médio','Apresenta alternativa de maior valor quando pertinente, sem pressão'),
      it('at-integridade','Integridade','Valores corretos, registro da venda, comprovante e pagamento')]},
    {t:'Cenários padronizados', itens:[
      it('cn-preco','Dúvida sobre preço','Pergunte opções de ingresso e diferenças entre combos'),
      it('cn-comparacao','Comparação','Qual combo compensa mais para um tempo ou grupo; confira o cálculo'),
      it('cn-pagamento','Pagamento','Troco, comprovante e meios de pagamento'),
      it('cn-regra','Pedido fora da regra','Peça educadamente uma exceção comum, sem insistir')]}]},
  {k:'identificacao', t:'Identificação', special:'identificacao'},
  {k:'exposicao', t:'Exposição',
   intro:'Fotografe a vitrine e todos os outros locais onde há produtos expostos.', extras:true,
   grupos:[{t:'Vitrine e exposição', itens:[
      it('ex-baloes','Balões','Presença, variedade, integridade, quantidade e disposição'),
      it('ex-livros','Livros','Organização, conservação, visibilidade e acesso'),
      it('ex-chaveiros','Chaveiros','Estado do expositor, quantidade, modelos e espaços vazios'),
      it('ex-slimes','Slimes e demais produtos','Identificação, apresentação, conservação e armazenamento')]}],
   fotos:[['f-vitrine','Vitrine — foto frontal ampla'],['f-pdv','Outros locais com produtos expostos']]},
  {k:'estoque', t:'Estoque', eixo:'auditoria', special:'estoque',
   intro:'Conte fisicamente cada produto, na vitrine e na reserva, e declare o que tem na loja. A comparação com o saldo do sistema é feita pela administração.',
   notaDica:'Avalie a contagem, a organização e a conservação do estoque. A conferência com o sistema é feita pela administração.',
   grupos:[{t:'Armazenamento', itens:[
      it('es-separacao','Separação por categoria/SKU','Identificação e acesso sem movimentação insegura'),
      it('es-locais','Locais de contagem','Vitrine, reserva e locais autorizados, sem dupla contagem'),
      it('es-avarias','Danificados, vencidos ou sem identificação','Registre e fotografe cada caso'),
      it('es-padrao','Padrão estético e organização','Produtos guardados com cuidado, limpos, empilhados com segurança e fáceis de achar')]}],
   fotos:[['f-armazenagem','Onde os produtos estão armazenados — visão geral'],['f-armazenagem-det','Como estão armazenados — detalhe das prateleiras e caixas']]},
  {k:'limpeza', t:'Limpeza', eixo:'organizacao',
   intro:'Registre a condição real no momento da visita. Sujeira conta em Organização; desgaste com risco vira ocorrência em Estrutura.',
   grupos:[{t:'Checklist de limpeza', itens:[
      it('lp-piso','Carpete e pisos','Sujeira, manchas, umidade, odores, desgaste e pontos soltos'),
      it('lp-moveis','Móveis e balcão','Poeira, manchas, resíduos e organização da recepção'),
      it('lp-computadores','Computadores e periféricos','Higiene e conservação aparente'),
      it('lp-lixeiras','Lixeiras','Conservação, capacidade, saco, odor e descarte'),
      it('lp-areas','Áreas internas e atrações','Resíduos, sujeira acumulada e materiais fora do lugar'),
      it('lp-apoio','Estoque e áreas de apoio','Circulação livre e materiais empilhados com segurança')]}],
   fotos:[['f-frente','Frente do evento'],['f-recepcao','Recepção'],['f-piso','Piso / carpete'],['f-internas','Áreas internas']],
   notaDica:'A nota de Organização cobre limpeza, vitrine, apresentação e armazenagem.', extras:true},
  {k:'estrutura', t:'Estrutura', eixo:'estrutura',
   intro:'Inspeção visual, sem desmontar nada. A aprovação visual não substitui inspeção técnica nem manutenção preventiva.', extras:true,
   alerta:'Perigo imediato (fio energizado acessível, estrutura instável, proteção rompida em área de queda, inflável perdendo sustentação): peça ao responsável para suspender o uso da área, acione a equipe técnica e registre ocorrência crítica. Não faça reparos nem testes elétricos.',
   grupos:[
    {t:'Frente, mobiliário e acessos', itens:[
      it('et-letreiro','Letreiro e fachada','Fixação, conservação, iluminação e acabamento'),
      it('et-recepcao','Recepção, baús e cadeiras','Estabilidade, integridade, quinas e peças danificadas'),
      it('et-cercados','Cercados do parque, portões e fechos','Bem fixados, alinhados, sem partes soltas; abertura e fechamento seguros'),
      it('et-emendas','Emendas e pontos de contato','Folgas, bordas, saliências e proteções ausentes')]},
    {t:'Proteções e atrações', itens:[
      it('et-redes','Redes de proteção','Tensão, fixação, rasgos, costuras, remendos e aberturas'),
      it('et-ferragens','Ferragens e partes metálicas','Espuma/isotubo e abraçadeiras, sem pontas cortantes'),
      it('et-escorregadores','Escorregadores e tobogãs','Alinhamento, firmeza, superfícies e fixações expostas'),
      it('et-torres','Torres','Montagem, proteções, redes e tensão aparente dos elásticos'),
      it('et-tuneis','Túneis de fitas','Costuras, rasgos e pontos de desprendimento'),
      it('et-piscina','Piscina de bolinhas','Nível, limpeza, bolinhas quebradas e dispersão'),
      it('et-tatames','Tatames da piscina de bolinhas','Bem fixados, sem frestas, rasgos ou bordas soltas'),
      it('et-fixacao','Fixação dos brinquedos','Brinquedos, painéis e estruturas bem presos ao piso ou à parede, sem balanço'),
      it('et-espumas','Espumas e protetores de quina','Presentes, inteiros e bem presos')]},
    {t:'Energia e tecnologia', itens:[
      it('et-eletrica','Instalações elétricas','Cabos aparentes, isolação, conexões improvisadas, tomadas e umidade'),
      it('et-quadro','Quadro de distribuição','Fechado, identificado, protegido e sem sinais de aquecimento'),
      it('et-pc','Computadores e sistema','Inicialização, sistema, monitor, teclado, mouse e conexão'),
      it('et-iluminacao','Iluminação','Lâmpadas funcionando, luminárias presas e sem fios soltos')]},
    {t:'Segurança', itens:[
      it('et-extintor','Extintor e saída de emergência','Extintor dentro da validade e acessível; saída sinalizada e desobstruída')]},
    {t:'Infláveis', inflaveis:true, itens:[
      it('if-superficie','Superfície','Rasgos, furos, costuras abertas e perda aparente de pressão'),
      it('if-tubos','Tubos e saídas de ar','Conexões firmes; saídas não usadas fechadas'),
      it('if-sopradores','Motores dos infláveis','Funcionando, sem ruído estranho, aquecimento ou fios expostos; ventilação livre'),
      it('if-caixas','Caixas de proteção','Integridade, fixação, ventilação e acesso restrito'),
      it('if-ancoragem','Ancoragens e afastamentos','Conforme manual do fabricante e capacidade de uso')]}]},
  {k:'ocorrencias', t:'Ocorrências', special:'ocorrencias'},
  {k:'envio', t:'Enviar', special:'envio'}
];
const ITEM_INDEX = {};
STEPS.forEach(s => (s.grupos||[]).forEach(g => g.itens.forEach(i => { ITEM_INDEX[i.id] = {...i, step:s.k, eixo:s.eixo||'organizacao', infl:!!g.inflaveis}; })));
const FOTO_INDEX = {};
STEPS.forEach(s => (s.fotos||[]).forEach(([id,t]) => FOTO_INDEX[id] = t));

/* ===================== Estado ===================== */
const S = {db:null, assets:null, user:null, me:{id:null, admin:false, write:null},
  eventos:new Map(), visitas:new Map(), val:new Map(), names:{}, loaded:{ev:false, vi:false, va:false, ac:false}, acoes:new Map(), pf:{}, psort:{col:'crit', dir:1}, ppage:1,
  tab:'painel', edit:null, rep:null, saving:false, pending:false, fotoKey:null, filt:{q:'', fr:'all'}, vfilt:'minhas'};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const nf1 = x => x == null ? '—' : Number(x).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
const nfi = x => x == null ? '—' : Number(x).toLocaleString('pt-BR');
const p2 = n => String(n).padStart(2,'0');
const fdt = ms => { if(!ms) return '—'; const d = new Date(ms); return `${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fd = ms => { if(!ms) return '—'; const d = new Date(ms); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`; };
const fiso = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const rid = () => Math.random().toString(36).slice(2, 10);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const pill = (txt, cls) => `<span class="pill ${cls||''}">${esc(txt)}</span>`;
const idOf = p => 'b-' + p.replace(/[^a-zA-Z0-9_-]/g,'-');
const evName = slugId => (S.eventos.get(slugId)||{}).nome || slugId;
const who = id => S.names[id] || (id && id === S.me.id ? 'Você' : S.me.admin ? 'Auditor' : 'Administração PEX');

function getPath(o, p){ return p.split('.').reduce((a,k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); let a = o; ks.slice(0,-1).forEach(k => { if(a[k] == null || typeof a[k] !== 'object') a[k] = /^\d+$/.test(k) ? [] : {}; a = a[k]; }); a[ks[ks.length-1]] = v; }

let tt;
function toast(msg, tipo){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (tipo ? ' ' + tipo : ''); t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, tipo === 'bad' ? 6000 : 4200); }

/* ===================== Cálculos ===================== */
function notaN(v, k){ const n = v.notas && v.notas[k] && v.notas[k].n; return (n === 0 || (typeof n === 'number')) ? n : (n === 'na' ? 'na' : null); }
function indice(v){ const ns = EIXOS.map(([k]) => notaN(v,k)).filter(n => typeof n === 'number'); return ns.length ? Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*10)/10 : null; }
function statusOf(v){
  if(!v.enviadoEm) return 'rascunho';
  const w = S.val.get(v._id);
  if(!w || !w.status) return 'enviado';
  if(w.status === 'devolvida') return (v.enviadoEm > (w.em||0)) ? 'enviado' : 'devolvida';
  return w.status;
}
function acaoOf(vid, oc){ const w = S.val.get(vid); return (w && w.acoes && w.acoes[oc.id]) || {}; }
function ocAberta(vid, oc){ const a = S.acoes && S.acoes.size ? acaoDaOc(vid, oc.id) : null; if(a) return a.status !== 'concluida'; return (acaoOf(vid, oc).status || 'aberta') !== 'resolvida'; }
function situacao(v){
  const crit = (v.ocorrencias||[]).some(o => o.crit === 'critica' && ocAberta(v._id, o));
  if(crit) return 'Bloqueado';
  if(!['validado','encerrado'].includes(statusOf(v))) return 'Em análise';
  const i = indice(v); return i == null ? '—' : (i >= 3 ? 'Aprovado' : 'Reprovado');
}
const sitCls = s => s === 'Bloqueado' ? 'bad' : s === 'Aprovado' ? 'ok' : s === 'Reprovado' ? 'warn' : s === 'Em análise' ? 'info' : '';
function submetidas(){ return [...S.visitas.values()].filter(v => v.enviadoEm && statusOf(v) !== 'devolvida'); }
function ultimaPorEvento(){ const m = new Map(); submetidas().forEach(v => { const c = m.get(v.evento); if(!c || v.enviadoEm > c.enviadoEm) m.set(v.evento, v); }); return m; }
function reincidente(v, oc){
  if(!oc.item) return false;
  return submetidas().some(o => o._id !== v._id && o.evento === v.evento && (o.enviadoEm||0) < (v.enviadoEm||Date.now()) && (o.ocorrencias||[]).some(x => x.item === oc.item));
}
function aplicavel(v, itemId){ const i = ITEM_INDEX[itemId]; return !(i.infl && !v.temInflaveis); }

/* ===================== Inicialização ===================== */
async function init(){
  const perfil = await portao();
  if(!perfil) return;
  const {db, user, assets} = PEX.runtime(perfil);
  S.db = db; S.user = user; S.assets = assets; S.perfil = perfil;
  const me = await user.me(); S.me.id = me.id; S.me.admin = !!me.canEdit; S.me.write = await user.can('data.write');
  document.body.classList.add('logado');
  document.querySelectorAll('#btn-conta, .side-av').forEach(el => el.textContent = iniciais(perfil.nome || perfil.email));
  document.querySelectorAll('.side-nome').forEach(el => el.textContent = nomeCurto(perfil.nome || perfil.email));
  document.querySelectorAll('.side-papel').forEach(el => el.textContent = (PAPEL[perfil.papel] || [''])[0]);
  S.me.master = perfil.papel === 'master';
  document.querySelectorAll('[data-admin]').forEach(el => el.hidden = !S.me.admin);
  document.querySelectorAll('[data-auditor]').forEach(el => el.hidden = !!S.me.admin);
  S.notifs = null; carregarNotif(); PEX.notif.assinar(S.me.id, n => { S.notifs = [n, ...(S.notifs || [])]; contarNotif(); if(!S.edit && !S.rep && S.tab === 'notificacoes') renderNotificacoes(); else if(!S.edit) toast(n.titulo); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') carregarNotif(); });
  if(S.me.admin){
    contarPendentes(); carregarAcoes();
    PEX.acoes.assinar(p => { if(p.new && p.new.id){ S.acoes.set(p.new.id, p.new); contarAcoes(); refresh(true); } });
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') carregarAcoes(); });
  }
  db.collection('eventos').onSnapshot(s => { S.eventos = new Map(s.docs.map(d => [d.id, d.data()])); S.loaded.ev = true; refresh(); }, e => toast('Erro ao carregar eventos: ' + e.code));
  db.collection('visitas').onSnapshot(s => { S.visitas = new Map(s.docs.map(d => [d.id, {...d.data(), _id:d.id}])); S.loaded.vi = true; resolveNames(); refresh(true); }, e => toast('Erro ao carregar visitas: ' + e.code));
  db.collection('validacoes').onSnapshot(s => { S.val = new Map(s.docs.map(d => [d.id, d.data()])); S.loaded.va = true; refresh(true); }, e => toast('Erro ao carregar validações: ' + e.code));
  route();
}
async function resolveNames(){
  if(!S.user) return;
  const ids = new Set();
  S.visitas.forEach(v => v.auditor && ids.add(v.auditor));
  S.val.forEach(w => (w.hist||[]).forEach(h => h.por && ids.add(h.por)));
  if(!ids.size) return;
  const ps = await S.user.profiles([...ids]);
  let ch = false;
  Object.values(ps).forEach(p => { const n = p.isMe ? (p.name ? p.name + ' (você)' : 'Você') : (p.name || ''); if(n && S.names[p.id] !== n){ S.names[p.id] = n; ch = true; } });
  if(ch) refresh(true);
}
function busy(){ const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#main').contains(a); }
function refresh(dataOnly){
  updateCounts();
  if(S.edit) return; // o editor é dono do seu rascunho
  if(S.rep){ if(!busy()) renderReport(); return; }
  if(dataOnly && busy()) return;
  if(S.tab === 'usuarios' && dataOnly) return;
  render();
}
function updateCounts(){
  const n = [...S.visitas.values()].filter(v => ['enviado','em_validacao'].includes(statusOf(v))).length;
  setCt('ct-val', n, S.me.admin && n);
}

/* ===================== Rotas ===================== */
function route(){
  if(S.edit && S.db){ clearTimeout(S.saveT); const e = S.edit; S.db.doc('visitas/' + e.id).set(clone(e.d)).catch(() => toast('A última alteração da visita não foi salva.')); }
  const h = location.hash.slice(1); S.tab = ['painel','visitas','notificacoes'].concat(S.me.admin ? ['validacao','pendencias','parques','relatorios','usuarios'] : []).includes(h) ? h : 'painel'; if(S.tab === 'parques' && !S.manterParque) S.parque = null; S.manterParque = false; S.edit = null; S.rep = null; render(); }
window.addEventListener('hashchange', route);
function go(tab){ if(location.hash.slice(1) === tab){ route(); } else location.hash = tab; }

function render(){
  document.body.classList.remove('side-over');
  document.body.classList.toggle('editing', !!S.edit);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String((b.dataset.v === S.tab || (b.dataset.v === 'mais' && ['parques','relatorios','usuarios'].includes(S.tab)) || (b.dataset.v === 'mais' && S.tab === 'notificacoes' && S.me.admin && b.closest('.tabbar'))) && !S.edit)));
  $('#foot-slot').innerHTML = '';
  if(S.edit) return renderEditor();
  if(S.rep) return renderReport();
  if(!S.loaded.ev || !S.loaded.vi){ return; }
  if(S.tab === 'painel') renderPainel();
  else if(S.tab === 'visitas') renderVisitas();
  else if(S.tab === 'usuarios') renderUsuarios();
  else if(S.tab === 'pendencias') renderPendencias();
  else if(S.tab === 'parques') renderParques();
  else if(S.tab === 'relatorios') renderRelatorios();
  else if(S.tab === 'notificacoes') renderNotificacoes();
  else renderValidacao();
}

/* ===================== Painel ===================== */
function renderPainel(){
  if(S.me.admin){ renderDashExec(); return; }
  const evs = [...S.eventos.entries()].map(([id,e]) => ({id, ...e})).sort((a,b) => (a.ordem??0) - (b.ordem??0));
  const last = ultimaPorEvento();
  const rows = evs.map(e => { const v = last.get(e.id); return {e, v, idx: v ? indice(v) : null, sit: v ? situacao(v) : 'Pendente', st: v ? statusOf(v) : null}; });
  const aud = rows.filter(r => r.v);
  const idxs = aud.map(r => r.idx).filter(x => x != null);
  const media = idxs.length ? Math.round(idxs.reduce((a,b)=>a+b,0)/idxs.length*10)/10 : null;
  const abertas = []; submetidas().forEach(v => (v.ocorrencias||[]).forEach(o => { if(ocAberta(v._id,o)) abertas.push(o); }));
  const aguard = [...S.visitas.values()].filter(v => ['enviado','em_validacao'].includes(statusOf(v))).length;
  const franquias = [...new Set(evs.map(e => e.franquia).filter(Boolean))].sort();
  const q = S.filt.q.toLowerCase();
  const ordem = {Bloqueado:0, Reprovado:1, 'Em análise':2, Aprovado:3, Pendente:4};
  const vis = rows.filter(r => (!q || (r.e.nome + ' ' + (r.e.franquia||'')).toLowerCase().includes(q)) && (S.filt.fr === 'all' || (S.filt.fr === 'none' ? !r.e.franquia : r.e.franquia === S.filt.fr)))
    .sort((a,b) => ordem[a.sit] - ordem[b.sit] || a.e.nome.localeCompare(b.e.nome,'pt-BR'));
  const eixoM = EIXOS.map(([k,t]) => { const ns = aud.map(r => notaN(r.v,k)).filter(n => typeof n === 'number'); return [t, ns.length ? Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*10)/10 : null]; });
  const div = new Map(); aud.forEach(r => (r.v.estoque||[]).forEach((s, si) => { const teo = teoricoDe(r.v, S.val.get(r.v._id), si); if(!s.sku || teo === '' || teo == null) return; const f = (+s.exposto||0) + (+s.reserva||0); div.set(s.sku, (div.get(s.sku)||0) + f - (+teo||0)); }));
  const divRows = [...div.entries()].sort((a,b) => a[1]-b[1]);
  const maxD = Math.max(5, ...divRows.map(d => Math.abs(d[1])));
  const admin = S.me.admin;
  const pct = evs.length ? Math.round(aud.length / evs.length * 100) : 0;
  const nome1 = ((S.perfil && S.perfil.nome) || '').trim().split(/\s+/)[0] || '';
  const chip = (v, t) => `<button type="button" class="chip" data-act="flt-fr" data-v="${esc(v)}" aria-pressed="${S.filt.fr === v}">${esc(t)}</button>`;

  $('#main').innerHTML = `<div class="stack">
    ${pageHead(admin ? 'Dashboard' : 'Meu painel', !admin ? 'Seus resultados nas auditorias que você enviou. Os outros auditores não veem as suas auditorias, e você não vê as deles.' : evs.length ? (aud.length ? 'Situação de cada parque pela auditoria mais recente, índices por eixo e pendências.' : 'Nenhuma auditoria enviada ainda. Os parques aparecem como pendentes até a primeira auditoria.') : 'Nenhum parque cadastrado. Cadastre os parques em Configurações.', admin ? `<span class="note" style="margin:0">${nome1 ? 'Olá, ' + esc(nome1.charAt(0) + nome1.slice(1).toLowerCase()) + ' · ' : ''}${fd(Date.now())}</span>` : '')}
    <section class="kpis" aria-label="Indicadores">
      <div class="kpi hero">
        <div><small>Índice PEX médio</small><b>${nf1(media)}</b><i>${media == null ? 'escala de 0 a 5' : ESCALA[Math.round(media)]}</i></div>
        <div style="text-align:right;display:grid;justify-items:end;gap:2px"><small>${admin ? 'Parques auditados' : 'Parques que visitei'}</small><b style="font-size:26px">${aud.length}<span style="font-size:15px;opacity:.7;font-weight:700"> / ${evs.length}</span></b><div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
      </div>
      <div class="kpi ok"><small>Aprovados</small><b>${aud.filter(r => r.sit === 'Aprovado').length}</b><i>índice ≥ 3, sem crítica</i></div>
      <div class="kpi bad"><small>Bloqueados</small><b>${aud.filter(r => r.sit === 'Bloqueado').length}</b><i>crítica em aberto</i></div>
      <div class="kpi warn"><small>Ocorrências abertas</small><b>${abertas.length}</b><i>${abertas.filter(o => o.crit === 'critica').length} críticas</i></div>
      <div class="kpi"><small>Aguardando validação</small><b>${aguard}</b><i>auditorias enviadas</i></div>
    </section>
    ${evs.length ? `<section class="stack tight">
      <div class="row between"><h2>Parques</h2><span class="row" style="gap:8px"><span class="note" style="margin:0">${vis.length} de ${evs.length}</span></span></div>
      <div class="search">${ic('busca')}<input type="search" id="f-q" data-flt="q" placeholder="Buscar parque ou sócio" value="${esc(S.filt.q)}" aria-label="Buscar evento"></div>
      ${franquias.length ? `<div class="chips" role="group" aria-label="Filtrar por sócio">${chip('all','Todas')}${franquias.map(f => chip(f, f)).join('')}${evs.some(e => !e.franquia) ? chip('none','Sem sócio') : ''}</div>` : ''}
      <datalist id="dl-fr">${franquias.map(f => `<option value="${esc(f)}">`).join('')}</datalist>
      <div class="vlist cols">${vis.map(r => `<div class="evc${r.v ? ' click ' + r.sit.replace(' ', '-') : ''}"${r.v ? ` data-act="ver-visita" data-id="${esc(r.v._id)}" role="button" tabindex="0"` : ''}>
          <div class="t">${esc(r.e.nome)}</div>
          <div class="ix"><b>${r.idx == null ? '—' : nf1(r.idx)}</b>${r.v ? pill(r.sit, sitCls(r.sit)) : pill('Pendente','')}</div>
          <div class="s">${r.e.franquia ? 'Sócio ' + esc(r.e.franquia) : 'Sócio a definir'}${r.e.inflaveis ? ' · com infláveis' : ''}<br>${r.v ? `Auditoria de ${fd(r.v.enviadoEm)} · ${esc(ST[r.st][0])}` : 'Sem auditoria enviada'}</div>

        </div>`).join('') || `<div class="empty">${ic('busca')}Nenhum parque encontrado com esses filtros.</div>`}</div>
    </section>
    <div class="grid2">
      <section class="card">
        <div class="card-h"><h2>Média por eixo</h2><span class="note">linha = 3, Adequado</span></div>
        ${idxs.length ? `<div class="bars">${eixoM.map(([t,m]) => `<div class="bar"><span>${t}</span><div class="tr"><i class="${m != null && m < 3 ? 'low' : ''}" style="width:${m == null ? 0 : m/5*100}%"></i><span class="ref" style="left:60%"></span></div><b>${nf1(m)}</b></div>`).join('')}</div>` : `<div class="empty">${ic('painel')}As médias aparecem depois da primeira visita enviada.</div>`}
      </section>
      ${admin ? `<section class="card">
        <div class="card-h"><h2>Divergência de estoque</h2><span class="note">físico − teórico</span></div>
        ${divRows.length ? `<div class="bars">${divRows.map(([s,d]) => `<div class="bar dbar"><span>${esc(s)}</span><div class="tr"><span class="zero"></span><i class="${d < 0 ? 'neg' : ''}" style="left:${d < 0 ? 50 - Math.abs(d)/maxD*50 : 50}%;width:${Math.abs(d)/maxD*50}%"></i></div><b>${d > 0 ? '+' : ''}${nfi(d)}</b></div>`).join('')}</div>` : `<div class="empty">${ic('caixa')}Nenhuma contagem enviada ainda.</div>`}
      </section>` : ''}
    </div>` : ''}
  </div>`;
}

/* ===================== Visitas (auditor) ===================== */
function renderVisitas(){
  const evs = [...S.eventos.entries()].map(([id,e]) => ({id, ...e})).sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  const all = [...S.visitas.values()].sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0));
  const mine = all.filter(v => v.auditor === S.me.id);
  const list = S.vfilt === 'minhas' || !S.me.admin ? mine : all;
  const canStart = S.me.write !== false && S.me.id;
  $('#main').innerHTML = `<div class="stack">
    ${pageHead('Auditorias', S.me.admin ? 'Inicie uma auditoria ou consulte as auditorias de todos os auditores. Tudo é salvo automaticamente enquanto o formulário é preenchido.' : 'Inicie uma auditoria e acompanhe o status das que você já fez. Tudo é salvo automaticamente enquanto você preenche.')}
    ${canStart ? `<section class="card stack tight">
      <h2>Nova auditoria</h2>
      ${evs.length ? `<label class="f">Para qual parque você está indo?<select id="novo-ev"><option value="">Escolha o parque…</option>${[...new Set(evs.map(e => e.franquia || ''))].sort((a,b) => (a || 'zz').localeCompare(b || 'zz', 'pt-BR', {numeric: true})).map(g => `<optgroup label="${esc(g ? 'Sócio ' + g : 'Sem sócio')}">${evs.filter(e => (e.franquia || '') === g).map(e => `<option value="${esc(e.id)}">${esc(e.nome)}</option>`).join('')}</optgroup>`).join('')}</select></label>
      <p class="note" id="novo-aviso" hidden style="color:var(--warn);font-weight:600"></p>
      <button class="btn pri block" type="button" data-act="novo" id="btn-novo">Iniciar auditoria ${ic('right')}</button>
      <p class="note" style="display:flex;gap:6px;align-items:flex-start">${ic('info','sm')}<span>A etapa anônima começa agora: não se identifique até concluir o cliente oculto.</span></p>`
      : `<div class="empty">${ic('local')}Nenhum parque cadastrado ainda. A administração cadastra os parques em Configurações.</div>`}
    </section>` : `<div class="banner info">${ic('info')}<div>Seu acesso é só de leitura. Peça à administração do PEX acesso de Auditor para registrar visitas.</div></div>`}
    <section class="stack tight">
      <div class="row between"><h2>${S.vfilt === 'minhas' || !S.me.admin ? 'Minhas auditorias' : 'Todas as auditorias'}</h2>
        <div class="segtog" role="group" aria-label="Quais visitas mostrar"${S.me.admin ? '' : ' hidden'}><button type="button" data-act="vfilt" data-v="minhas" aria-pressed="${S.vfilt === 'minhas'}">Minhas</button><button type="button" data-act="vfilt" data-v="todas" aria-pressed="${S.vfilt !== 'minhas'}">Todas</button></div></div>
      <div class="vlist cols">${list.map(visitaCard).join('') || `<div class="empty">${ic('visitas')}${S.vfilt === 'minhas' ? 'Você ainda não registrou nenhuma auditoria.' : 'Nenhuma auditoria registrada ainda.'}</div>`}</div>
    </section>
  </div>`;
}
function visitaCard(v){
  const st = statusOf(v); const done = STEPS.filter(s => stepDone(v, s)).length; const aberta = !v.enviadoEm || st === 'devolvida';
  return `<button type="button" class="vitem" data-act="abrir" data-id="${esc(v._id)}">
    <span class="t">${esc(evName(v.evento))}</span>${pill(ST[st][0], ST[st][1])}
    <span class="s"><span>${ic('user','sm')}${esc(quem(v))}</span><span>${ic('cal','sm')}${fdt(v.criadoEm)}</span><span class="mono">${esc(v.codigo||'')}</span></span>
    ${aberta ? `<span class="prog" aria-hidden="true"><i style="width:${done/STEPS.length*100}%"></i></span><span class="s">${done} de ${STEPS.length} etapas concluídas</span>` : `<span class="s">Enviada ${fdt(v.enviadoEm)}${indice(v) != null ? ` · índice <b style="color:var(--ink)">${nf1(indice(v))}</b>` : ''}</span>`}
  </button>`;
}

async function novaVisita(){
  const ev = $('#novo-ev').value;
  if(!ev){ toast('Escolha o parque antes de iniciar.'); return; }
  const e = S.eventos.get(ev) || {};
  const ref = S.db.collection('visitas').doc();
  const now = Date.now(); const d = new Date(now);
  const data = {evento:ev, auditor:S.me.id, criadoEm:now, codigo:`PEX-${String(d.getFullYear()).slice(2)}${p2(d.getMonth()+1)}${p2(d.getDate())}-${ref.id.slice(-4).toUpperCase()}`,
    temInflaveis: e.inflaveis === true, itens:{}, notas:{}, fotosObr:{}, estoque: SKUS.map(s => ({sku:s, fixo:true, exposto:'', reserva:'', just:'', fotos:[]})), atendentes:[''], extras:{},
    ocorrencias:[], lider:'', identificadoEm:null, enviadoEm:null};
  $('#btn-novo').disabled = true;
  try{ await ref.set(data); openEditor(ref.id, data); }
  catch(err){ $('#btn-novo').disabled = false; toast(err && err.code === 'invalid_argument' ? 'Você não tem permissão para registrar visitas neste painel.' : 'Não foi possível criar a visita. Tente de novo.'); }
}

function editavel(v){ const st = statusOf(v); return (st === 'rascunho' || st === 'devolvida') && (v.auditor === S.me.id); }
function abrir(id){ const v = S.visitas.get(id); if(!v) return; if(editavel(v)) openEditor(id, v); else openReport(id); }

/* ===================== Editor da visita ===================== */
function openEditor(id, data){
  const d = clone(data); delete d._id;
  S.edit = {id, d, step: d.identificadoEm ? 2 : 0, err:null, salvo: null};
  render(); window.scrollTo(0,0);
}
function queueSave(){ clearTimeout(S.saveT); setSaved('Salvando…'); S.saveT = setTimeout(flush, 700); }
async function flush(){
  if(!S.edit) return;
  if(S.saving){ S.pending = true; return; }
  S.saving = true; const {id, d} = S.edit;
  try{ const r = await S.db.doc('visitas/' + id).set(clone(d)); if(S.edit) S.edit.salvo = Date.now(); setSaved(r && r.pendente ? 'Salvo no aparelho' : 'Salvo ' + fdt(Date.now()).slice(6)); }
  catch(err){ setSaved('Não salvo'); toast(err && err.code === 'quota_exceeded' ? 'O banco do PEX está cheio. Avise a administração.' : 'Não foi possível salvar. Verifique a conexão; suas respostas continuam na tela.'); }
  S.saving = false; if(S.pending){ S.pending = false; flush(); }
}
function setSaved(t){ const el = $('#saved'); if(el){ el.textContent = t; el.className = 'saved' + (/Salvando/.test(t) ? ' busy' : /Não/.test(t) ? ' err' : ''); } }

function stepDone(d, s){
  if(s.special === 'identificacao') return !!d.identificadoEm;
  if(s.special === 'ocorrencias') return STEPS.filter(x => x.grupos || x.special === 'identificacao').every(x => stepDone(d, x)) && (d.ocorrencias||[]).every(o => (o.local||'').trim() && (o.desc||'').trim() && (o.crit !== 'critica' || o.comunicado));
  if(s.special === 'envio') return !!d.enviadoEm;
  const items = (s.grupos||[]).flatMap(g => g.itens).filter(i => aplicavel(d, i.id));
  const ok = items.every(i => d.itens[i.id] && d.itens[i.id].r);
  const nota = !s.eixo || (d.notas[s.eixo] && d.notas[s.eixo].n != null);
  const est = s.special !== 'estoque' || estoqueOk(d);
  if(s.fotos && !s.fotos.every(([id]) => (d.fotosObr[id]||[]).length)) return false;
  if(s.k === 'anonimo' && !atendentesOk(d)) return false;
  if(s.extras && !extrasOk(d, s.k)) return false;
  return ok && nota && est;
}

function renderEditor(){
  const {d, step} = S.edit; const s = STEPS[step];
  const v = S.visitas.get(S.edit.id); const w = S.val.get(S.edit.id);
  const devolvida = v && statusOf({...v, _id:S.edit.id}) === 'devolvida';
  const done = STEPS.map(x => stepDone(d, x));
  $('#main').innerHTML = `<div class="stack">
    <div class="ed-top">
      <button class="btn icon" type="button" data-act="fechar" id="btn-fechar" aria-label="Sair da auditoria" data-tip="Sair da auditoria">${ic('left')}</button>
      <div style="min-width:0;flex:1"><h1>${esc(evName(d.evento))}</h1>
        <div class="ed-meta"><span class="mono">${esc(d.codigo)}</span><span>${d.identificadoEm ? 'Identificado às ' + fdt(d.identificadoEm).slice(6) : 'Etapa anônima em andamento'}</span></div></div>
    </div>
    ${devolvida && w && w.obs ? `<div class="banner warn">${ic('alerta')}<div><b>Devolvida pela administração:</b> ${esc(w.obs)}</div></div>` : ''}
    <div class="progress">
      <div class="lbl"><b>Etapa ${step+1} de ${STEPS.length}</b><span>${done.filter(Boolean).length} concluída(s)</span></div>
      <div class="segbar">${STEPS.map((x,i) => `<button type="button" class="${i === step ? 'on' : done[i] ? 'done' : ''}" data-act="step" data-i="${i}" aria-label="Etapa ${i+1}: ${x.t}${done[i] ? ', concluída' : ''}"></button>`).join('')}</div>
    </div>
    <nav class="steps" aria-label="Etapas da visita">${STEPS.map((x,i) => `<button type="button" class="stp${i === step ? ' on' : ''}${i !== step && done[i] ? ' done' : ''}" data-act="step" data-i="${i}" id="stp-${i}"${i === step ? ' aria-current="step"' : ''}><b>${done[i] && i !== step ? '✓' : i+1}</b>${x.t}</button>`).join('')}</nav>
    <section class="stack" id="step-body">${stepBody(s, d)}</section>
  </div>`;
  $('#foot-slot').innerHTML = `<div class="foot"><div class="wrap">
    <button class="btn icon" type="button" data-act="ant" id="btn-ant" aria-label="Etapa anterior"${step === 0 ? ' disabled' : ''}>${ic('left')}</button>
    <span class="saved" id="saved">${S.edit.salvo ? 'Salvo ' + fdt(S.edit.salvo).slice(6) : 'Salvo'}</span>
    ${step < STEPS.length-1 ? `<button class="btn pri" type="button" data-act="prox" id="btn-prox">${step === 0 && !d.identificadoEm ? 'Concluir cliente oculto' : 'Próxima etapa'} ${ic('right')}</button>` : '<span style="width:46px"></span>'}
  </div></div>`;
}

function stepBody(s, d){
  const n = STEPS.indexOf(s) + 1;
  let h = `<div class="step-h"><span class="num">${n}</span><div><h2>${s.t}</h2>${s.intro ? `<p class="note">${s.intro}</p>` : ''}</div></div>`;
  if(s.alerta) h += `<div class="banner ${s.k === 'estrutura' ? 'bad' : 'info'}">${ic(s.k === 'estrutura' ? 'alerta' : 'escudo')}<div>${s.alerta}</div></div>`;
  if(s.special === 'identificacao') return h + identBody(d);
  if(s.special === 'ocorrencias') return h + ocBody(d);
  if(s.special === 'envio') return h + envioBody(d);
  if(s.k === 'anonimo') h += atendentesBody(d);
  if(s.special === 'estoque') h += estoqueBody(d);
  if(s.k === 'estrutura') h += `<label class="chk card" style="padding:14px"><input type="checkbox" id="b-temInflaveis" data-b="temInflaveis" data-bool${d.temInflaveis ? ' checked' : ''} data-rerender><span><b>Este parque tem infláveis</b><br><span class="note">Inclui o módulo de infláveis na inspeção.</span></span></label>`;
  (s.grupos||[]).forEach(g => {
    if(g.inflaveis && !d.temInflaveis) return;
    h += `<div><div class="grp-t">${g.t}</div>${g.itens.map(i => itemBody(i, d)).join('')}</div>`;
  });
  if(s.fotos) h += `<div><div class="grp-t">Fotos obrigatórias</div><div class="req">${s.fotos.map(([id,t]) => { const fs = (d.fotosObr[id]||[]); return `<div class="req-i${fs.length ? ' done' : ''}"><span><span class="dot">${ic(fs.length ? 'check' : 'camera', 'sm')}</span>${t}</span>${photos('obr:' + id, fs, true)}</div>`; }).join('')}</div></div>`;
  if(s.extras) h += extrasBody(s, d);
  if(s.eixo) h += notaBody(s, d);
  return h;
}

function itemBody(i, d){
  const a = d.itens[i.id] || {}; const r = a.r || '';
  return `<div class="item ${r}" id="it-${i.id}">
    <div class="item-h"><div class="tt">${i.t}</div><div class="dc">${i.d}</div></div>
    <div class="seg" role="group" aria-label="${esc(i.t)}">
      <button type="button" class="c${r === 'c' ? ' on' : ''}" data-act="res" data-item="${i.id}" data-v="c" aria-pressed="${r === 'c'}">${ic('check')}Conforme</button>
      <button type="button" class="nc${r === 'nc' ? ' on' : ''}" data-act="res" data-item="${i.id}" data-v="nc" aria-pressed="${r === 'nc'}">${ic('x')}Não conforme</button>
      <button type="button" class="na${r === 'na' ? ' on' : ''}" data-act="res" data-item="${i.id}" data-v="na" aria-pressed="${r === 'na'}">${ic('minus')}N/A</button>
    </div>

    <div class="row">${photos('item:' + i.id, a.fotos||[], true)}${r === 'nc' ? `<button type="button" class="btn sm${(d.ocorrencias||[]).some(o => o.item === i.id) ? '' : ' danger'}" data-act="oc-add" data-item="${i.id}" id="oc-from-${i.id}">${(d.ocorrencias||[]).some(o => o.item === i.id) ? ic('check','sm') + 'Ocorrência aberta' : ic('flag','sm') + 'Abrir ocorrência'}</button>` : ''}</div>` : ''}
  </div>`;
}

function photos(key, ids, canAdd){
  const add = canAdd && S.assets ? `<button type="button" class="addph" data-act="foto" data-key="${key}" id="ph-${key.replace(/[^a-z0-9]/gi,'-')}">${ic('camera')}Foto</button>` : '';
  return `<div class="photos">${ids.map(f => `<div class="ph"><img alt="Foto" decoding="async" data-act="ver" data-fid="${esc(f)}">${canAdd ? `<button type="button" class="x" data-act="rmfoto" data-key="${key}" data-fid="${esc(f)}" aria-label="Remover foto">${ic('x','sm')}</button>` : ''}</div>`).join('')}${add}${canAdd && !S.assets ? '<span class="note">Seu acesso não permite enviar fotos.</span>' : ''}</div>`;
}

const CRITERIO = ['Condição inaceitável, falha grave ou ausência total de conformidade.','Múltiplas falhas relevantes; correção urgente.','Falhas recorrentes ou significativas; plano corretivo necessário.','Atende ao essencial, com melhorias identificadas.','Padrão elevado, com desvios pontuais.','Padrão integralmente atendido, evidências completas.'];
function notaBody(s, d){
  const k = s.eixo; const n = d.notas[k] || {}; const label = EIXOS.find(e => e[0] === k)[1];
  return `<div class="nota" id="nota-${k}">
    <div><div class="eyebrow">Nota do eixo</div><h3 style="font-size:18px;margin-top:2px">${label}</h3><p class="note">${s.notaDica || 'Avalie o eixo inteiro de 0 a 5, usando os itens respondidos como evidência.'}${k === 'estrutura' ? ' Use N/A só se nada de estrutura se aplicar.' : ''}</p></div>
    <div class="score${k === 'estrutura' ? ' na7' : ''}" role="group" aria-label="Nota de ${label}">${[0,1,2,3,4,5].map(x => `<button type="button" class="${n.n === x ? 'on' : ''}" data-act="nota" data-eixo="${k}" data-v="${x}" aria-pressed="${n.n === x}" aria-label="${x}: ${ESCALA[x]}">${x}</button>`).join('')}${k === 'estrutura' ? `<button type="button" class="${n.n === 'na' ? 'on' : ''}" data-act="nota" data-eixo="${k}" data-v="na" aria-pressed="${n.n === 'na'}" style="font-size:14px">N/A</button>` : ''}</div>
    <div class="score-l">${n.n == null ? '<span class="muted">Toque numa nota de 0 a 5.</span>' : n.n === 'na' ? 'Não se aplica a este evento.' : `<b>${n.n} · ${ESCALA[n.n]}</b> — ${CRITERIO[n.n]}`}</div>
    <textarea id="${idOf('notas.' + k + '.j')}" data-b="notas.${k}.j" placeholder="Justificativa da nota (obrigatória)" aria-label="Justificativa da nota de ${label}">${esc(n.j||'')}</textarea>
  </div>`;
}

function identBody(d){
  return `<div class="card stack tight">
    ${d.identificadoEm ? `<div class="banner ok">${ic('check')}<div>Cliente oculto encerrado e auditor identificado às <b>${fdt(d.identificadoEm)}</b>.</div></div>` :
    `<div class="banner warn">${ic('alerta')}<div>Encerre o cliente oculto antes de se identificar. Depois, apresente sua credencial e informe ao responsável que a visita faz parte do PEX.</div></div>
     <button class="btn pri block" type="button" data-act="identificar" id="btn-ident">${ic('user')}Encerrar cliente oculto e me identificar</button>`}
    <label class="f">Líder ou responsável presente<input type="text" id="b-lider" data-b="lider" value="${esc(d.lider||'')}" placeholder="Nome de quem acompanhou a visita"></label>
    <p class="note">O líder acompanha a etapa identificada, esclarece ocorrências e confirma ciência.</p>
  </div>`;
}

function estoqueBody(d){
  return `<div><div class="grp-t">Contagem do estoque</div>
    <p class="note" style="margin:-4px 0 10px">Conte o que está exposto e o que está na reserva, sem contar nada duas vezes. Se o produto não existir na loja, coloque 0.</p>
    <div class="skus">${d.estoque.map((r,i) => { const f = (+r.exposto||0) + (+r.reserva||0); const fixo = r.fixo || (!r.outro && SKUS.includes(r.sku)); return `<div class="sku">
      <div class="sku-h">${fixo ? `<b style="font-size:16px;flex:1">${esc(r.sku)}</b>` : `<input type="text" id="b-est-${i}-sku" data-b="estoque.${i}.sku" value="${esc(r.sku)}" placeholder="Qual produto?" aria-label="Nome do produto"><button type="button" class="btn sm icon" data-act="est-rm" data-i="${i}" aria-label="Remover ${esc(r.sku || 'produto')}">${ic('lixo','sm')}</button>`}</div>
      <div class="sku-n two">
        <label class="f">Exposto<input type="number" inputmode="numeric" min="0" id="b-est-${i}-exp" data-b="estoque.${i}.exposto" data-calc value="${esc(r.exposto)}"></label>
        <label class="f">Reserva<input type="number" inputmode="numeric" min="0" id="b-est-${i}-res" data-b="estoque.${i}.reserva" data-calc value="${esc(r.reserva)}"></label>
      </div>
      <div class="sku-r"><span>Total na loja</span><b class="mono" id="est-f-${i}">${r.exposto === '' && r.reserva === '' ? '—' : f}</b></div>

function updEst(i){

function ocBody(d){
  const ocs = d.ocorrencias || [];
  return `<p class="note">Cada achado com local exato, descrição objetiva, fotos, criticidade e ação proposta. Registre fatos; não atribua intenção.</p>
  <datalist id="dl-atend">${(d.atendentes||[]).filter(Boolean).map(n => `<option value="${esc(n)}">`).join('')}</datalist>

    <div class="row between"><span class="row" style="gap:8px"><span class="mono">${esc(d.codigo)}-O${i+1}</span>${pill(CRIT[o.crit][0], CRIT[o.crit][1])}</span><button class="btn sm danger" type="button" data-act="oc-rm" data-i="${i}" id="oc-rm-${i}">Remover</button></div>

    <div class="fgrid">
      <label class="f">Categoria do problema<select id="b-oc-${i}-eixo" data-b="ocorrencias.${i}.eixo">${EIXOS.map(([k,t]) => `<option value="${k}"${o.eixo === k ? ' selected' : ''}>${CATEG[k]}</option>`).join('')}</select></label>
      <label class="f">Gravidade<select id="b-oc-${i}-crit" data-b="ocorrencias.${i}.crit" data-rerender>${Object.entries(CRIT).map(([k,[t]]) => `<option value="${k}"${o.crit === k ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
    </div>
    <label class="f">Local exato<input type="text" id="b-oc-${i}-local" data-b="ocorrencias.${i}.local" value="${esc(o.local||'')}" placeholder="Ex.: torre 2, lado do escorregador"></label>
    <label class="f">Descrição objetiva<textarea id="b-oc-${i}-desc" data-b="ocorrencias.${i}.desc" placeholder="O que foi observado">${esc(o.desc||'')}</textarea></label>
    <label class="f">Ação proposta<input type="text" id="b-oc-${i}-acao" data-b="ocorrencias.${i}.acao" value="${esc(o.acao||'')}" placeholder="O que precisa ser feito"></label>
    <label class="f">Colaboradora envolvida (nome completo, se houver)<input type="text" id="b-oc-${i}-colab" data-b="ocorrencias.${i}.colab" value="${esc(o.colab||'')}" list="dl-atend" placeholder="Ex.: Maria Aparecida da Silva"></label>
    ${o.crit === 'critica' ? `<label class="chk banner bad"><input type="checkbox" id="b-oc-${i}-com" data-b="ocorrencias.${i}.comunicado" data-bool${o.comunicado ? ' checked' : ''}><span>Responsável comunicado na hora e uso da área suspenso; equipe técnica acionada</span></label>` : ''}
    ${photos('oc:' + i, o.fotos||[], true)}
  </div>`).join('') || `<div class="empty">${ic('flag')}Nenhuma ocorrência registrada nesta visita.<br>Itens marcados como não conforme podem virar ocorrência.</div>`}
  <button class="btn block" type="button" data-act="oc-add" id="btn-oc-add">${ic('plus')}Nova ocorrência</button>
  ${criticalHint()}`;
}
const CRIT_HINT = '<div class="banner info"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg><div><b>Crítica</b>: risco imediato de acidente, choque ou queda. <b>Alta</b>: desvio relevante sem perigo imediato. <b>Média</b>: impacto operacional moderado. <b>Baixa</b>: melhoria estética ou de padronização.</div></div>';
function criticalHint(){ return CRIT_HINT; }

function aceite(d){
  const pend = [];
  const nr = []; const naSemJust = [];
  STEPS.forEach(s => (s.grupos||[]).forEach(g => g.itens.forEach(i => { if(!aplicavel(d,i.id)) return; const a = d.itens[i.id]; if(!a || !a.r) nr.push(i.t); else if(a.r === 'na' && !(a.obs||'').trim()) naSemJust.push(i.t); })));
  const fotosF = Object.keys(FOTO_INDEX).filter(k => !(d.fotosObr[k]||[]).length).map(k => FOTO_INDEX[k]);
  const notasF = EIXOS.filter(([k]) => { const n = d.notas[k]; return !n || n.n == null || !(n.j||'').trim(); }).map(e => e[1]);
  const estOk = estoqueOk(d);
  const extF = STEPS.filter(s => s.extras && !extrasOk(d, s.k)).map(s => s.t);
  const ocF = (d.ocorrencias||[]).filter(o => !(o.desc||'').trim() || !(o.local||'').trim());
  const critF = (d.ocorrencias||[]).filter(o => o.crit === 'critica' && !o.comunicado);
  return [
    ['Etapa anônima concluída antes da identificação', !!d.identificadoEm, 'Conclua a etapa de identificação.'],
    ['Todos os itens aplicáveis respondidos', !nr.length, nr.length + ' sem resposta: ' + nr.slice(0,4).join(', ') + (nr.length > 4 ? '…' : '')],
    ['N/A justificado', !naSemJust.length, 'Falta justificar: ' + naSemJust.join(', ')],
    ['Notas dos quatro eixos com justificativa', !notasF.length, 'Falta: ' + notasF.join(', ')],
    ['Nome completo de quem atendeu', atendentesOk(d), 'Informe na etapa Cliente oculto o nome completo da colaboradora que atendeu.'],
    ['Contagem de todos os produtos', estOk, 'Preencha Exposto e Reserva de todos os produtos (use 0 se não houver) e dê nome aos "Outros".'],
    ['Outros locais com nome, resposta e foto', !extF.length, 'Complete os outros locais em: ' + extF.join(', ')],
    ['Fotos obrigatórias', !fotosF.length, 'Faltam: ' + fotosF.join(', ')],
    ['Ocorrências com local e descrição', !ocF.length, ocF.length + ' ocorrência(s) incompleta(s).'],
    ['Ocorrências críticas comunicadas', !critF.length, 'Confirme a comunicação imediata das críticas.']
  ];
}
function envioBody(d){
  const ck = aceite(d); const ok = ck.every(c => c[1]);
  const idx = indice(d); const crit = (d.ocorrencias||[]).filter(o => o.crit === 'critica').length;
  return `${revisaoBody(d)}
  <div class="grid2">
    <div class="idx-card"><span class="note" style="margin:0;font-weight:600">Índice PEX desta visita</span><div class="idx">${nf1(idx)}</div><p class="note" style="margin:0">${idx == null ? 'Dê as notas dos eixos.' : ESCALA[Math.round(idx)]}${crit ? ` · <b style="color:var(--bad)">${crit} crítica(s) bloqueiam a aprovação</b>` : ''}</p></div>
    <div class="card"><div class="bars">${EIXOS.map(([k,t]) => { const n = notaN(d,k); return `<div class="bar"><span>${t}</span><div class="tr"><i class="${typeof n === 'number' && n < 3 ? 'low' : ''}" style="width:${typeof n === 'number' ? n/5*100 : 0}%"></i><span class="ref" style="left:60%"></span></div><b>${n === 'na' ? 'N/A' : n == null ? '—' : n}</b></div>`; }).join('')}</div></div>

function fotoArr(key, ctx, create){
  const [t, k] = key.split(':');
  if(t === 'acao'){ const w = ctx; w.acoes = w.acoes || {}; w.acoes[k] = w.acoes[k] || {}; if(create) w.acoes[k].fotos = w.acoes[k].fotos || []; return w.acoes[k].fotos || []; }
  const d = ctx;
  if(t === 'item'){ d.itens[k] = d.itens[k] || {}; if(create) d.itens[k].fotos = d.itens[k].fotos || []; return d.itens[k].fotos || []; }
  if(t === 'obr'){ if(create) d.fotosObr[k] = d.fotosObr[k] || []; return d.fotosObr[k] || []; }
  if(t === 'est'){ const r = d.estoque[+k]; if(create) r.fotos = r.fotos || []; return r.fotos || []; }
  if(t === 'oc'){ const o = d.ocorrencias[+k]; if(create) o.fotos = o.fotos || []; return o.fotos || []; }
  if(t === 'ext'){ const [sk, j] = k.split('.'); const x = ((d.extras||{})[sk]||[])[+j]; if(!x) return []; if(create) x.fotos = x.fotos || []; return x.fotos || []; }
  return [];
}
async function compress(file){
  try{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const max = 1600; const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return b && b.size < file.size ? b : file;
  }catch(e){ return file; }
}
async function uploadFiles(files){
  const key = S.fotoKey; if(!key || !S.assets) return;
  if(key === 'acform' || key === 'acev'){
    const arr = key === 'acform' ? S.acForm.fotos : (S.acEvFotos = S.acEvFotos || []);
    for(const f of files){ try{ const b = await compress(f); const res = await S.assets.upload(b, {type: b.type || 'image/jpeg'}); arr.push(res.id); }catch(err){ toast('Não foi possível enviar a foto. Tente de novo.', 'bad'); break; } }
    acaoSheet(S.acAberta); return;
  }
  const ctx = key.startsWith('acao:') ? S.rep && S.rep.w : S.edit && S.edit.d;
  if(!ctx) return;
  let n = 0;
  for(const f of files){
    n++; toast(`Enviando foto ${n} de ${files.length}…`);
    try{
      const b = await compress(f);
      const res = await S.assets.upload(b, {type: b.type || 'image/jpeg'});
      fotoArr(key, ctx, true).push(res.id);
    }catch(err){
      const c = err && err.code;
      toast(c === 'unsupported_type' ? 'Formato não aceito. Use JPG, PNG ou WEBP (no iPhone: Ajustes › Câmera › Formatos › Mais compatível).' : c === 'too_large' ? 'Foto acima de 20 MB.' : c === 'quota_or_state' ? 'O espaço de fotos do PEX está cheio. Avise a administração.' : c === 'rate_limited' ? 'Muitas fotos de uma vez. Aguarde um pouco e tente de novo.' : 'Não foi possível enviar a foto. Tente de novo.');
      break;
    }
  }
  if(key.startsWith('acao:')){ saveVal(); renderReport(); } else { queueSave(); keepScroll(renderEditor); }
  toast(n === 1 ? 'Foto adicionada.' : `${n} fotos adicionadas.`);
}

    queueSave();

const PAPEL = {pendente:['Aguardando liberação','warn'], auditor:['Auditor',''], admin:['Administração','info'], master:['Master','brand'], bloqueado:['Bloqueado','bad']};
let recuperando = false;

async function portao(){
  if(!window.PEX || !PEX.configurado){
    $('#main').innerHTML = `<div class="auth"><div><h1>Plataforma PEX</h1><p class="lead">O app ainda não está ligado ao banco de dados.</p></div>
      <div class="banner warn">Preencha <b>SUPABASE_URL</b> e <b>SUPABASE_ANON_KEY</b> no arquivo <span class="mono">config.js</span> e publique de novo.</div></div>`;
    return null;
  }
  PEX.sb.auth.onAuthStateChange(ev => {
    if(ev === 'PASSWORD_RECOVERY'){ recuperando = true; telaNovaSenha(); }
    else if(ev === 'SIGNED_OUT'){ location.hash = ''; location.reload(); }
  });
  if(/type=recovery/.test(location.hash)) recuperando = true;
  for(;;){
    let perfil;
    try{ perfil = await PEX.perfilAtual(); }
    catch(e){ $('#main').innerHTML = `<div class="auth"><div class="banner bad">Não foi possível conectar à Plataforma PEX. Verifique a internet.</div><button class="btn pri" type="button" onclick="location.reload()">Tentar de novo</button></div>`; return null; }
    if(recuperando && perfil){ telaNovaSenha(); await new Promise(r => { window.__pexSenhaOk = r; }); recuperando = false; continue; }
    if(!perfil){ telaLogin('entrar'); await new Promise(r => { window.__pexEntrou = r; }); continue; }
    if(perfil.papel === 'pendente' || perfil.papel === 'bloqueado'){ telaAguardando(perfil); await new Promise(r => { window.__pexEntrou = r; }); continue; }
    return perfil;
  }
}

    <div class="card"><form id="f-auth" data-modo="${modo}" novalidate>

      ${modo !== 'recuperar' ? `<label class="f">Senha<span class="pw"><input type="password" id="a-senha" autocomplete="${modo === 'criar' ? 'new-password' : 'current-password'}"${modo === 'criar' ? ' minlength="8"' : ''} required><button type="button" data-act="pw-ver" aria-label="Mostrar senha">${ic('olho')}</button></span></label>` : ''}
      <p class="note" id="a-err" role="alert" hidden></p>

    </form></div>
    <div class="auth-alt">
      ${modo !== 'entrar' ? '<button type="button" class="link" data-act="auth-modo" data-v="entrar">Já tenho acesso</button>' : '<button type="button" class="link" data-act="auth-modo" data-v="criar">Criar acesso</button>'}

  $('#main').innerHTML = `<div class="auth-wrap"><div class="auth"><div class="auth-hero"><span class="mark"><b>PEX</b></span><div><h1>Nova senha</h1><p class="lead">Escolha uma nova senha para entrar na Plataforma PEX.</p></div></div>
    <div class="card"><form id="f-senha" novalidate><label class="f">Nova senha (mínimo 8 caracteres)<span class="pw"><input type="password" id="s-nova" autocomplete="new-password" minlength="8" required><button type="button" data-act="pw-ver" aria-label="Mostrar senha">${ic('olho')}</button></span></label>
    <p class="note" id="s-err" role="alert" hidden></p><button class="btn pri block" type="submit">Salvar nova senha</button></form></div></div></div>`;

function msgAuth(e){
  const m = String((e && e.message) || '').toLowerCase();
  if(/invalid login credentials/.test(m)) return 'E-mail ou senha incorretos.';
  if(/email not confirmed/.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/already registered|already been registered/.test(m)) return 'Este e-mail já tem cadastro. Use "Já tenho acesso" ou "Esqueci a senha".';
  if(/password should be|at least \d+ char/i.test(m)) return 'A senha precisa ter pelo menos 8 caracteres.';
  if(/rate limit|too many|security purposes/.test(m) && !/email rate limit/.test(m)) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  if(/email address .* is invalid|invalid email|unable to validate email/.test(m)) return 'Este e-mail foi recusado. Confira se está correto ou use outro endereço.';
  if(/email rate limit/.test(m)) return 'O servidor atingiu o limite de e-mails de confirmação. Avise a administração do PEX para liberar o seu acesso.';
  if(/signups? (are )?(disabled|not allowed)|email_provider_disabled/.test(m)) return 'O cadastro por e-mail está desligado no Supabase (Authentication › Sign In / Providers › Email). Avise a administração do PEX.';
  if(/not authorized|email address .* not authorized/.test(m)) return 'O Supabase não conseguiu enviar o e-mail de confirmação. A administração precisa desligar "Confirm email" no Supabase.';
  if(/error sending|smtp/.test(m)) return 'O Supabase não conseguiu enviar o e-mail. A administração precisa desligar "Confirm email" no Supabase.';
  if(/failed to fetch|network/.test(m)) return 'Sem conexão. Verifique a internet.';
  return 'Não foi possível concluir. Tente de novo.';
}

document.addEventListener('submit', async e => {
  const f = e.target;
  if(f.id === 'f-auth'){
    e.preventDefault();
    const modo = f.dataset.modo; const err = $('#a-err'); const btn = $('#a-btn');
    const email = $('#a-email').value.trim(); const senha = $('#a-senha') ? $('#a-senha').value : '';
    const nome = $('#a-nome') ? $('#a-nome').value.trim() : '';
    const falha = m => { err.textContent = m; err.hidden = false; err.style.color = 'var(--bad)'; btn.disabled = false; };
    if(!/^\S+@\S+\.\S+$/.test(email)) return falha('Digite um e-mail válido.');
    if(modo === 'criar' && nome.length < 3) return falha('Digite seu nome completo.');
    if(modo === 'criar' && senha.length < 8) return falha('A senha precisa ter pelo menos 8 caracteres.');
    if(modo === 'entrar' && !senha) return falha('Digite a sua senha.');
    btn.disabled = true; err.hidden = true;
    try{
      if(modo === 'entrar'){ await PEX.entrar(email, senha); window.__pexEntrou && window.__pexEntrou(); }
      else if(modo === 'criar'){
        const r = await PEX.cadastrar(nome, email, senha);
        if(r && r.session){ window.__pexEntrou && window.__pexEntrou(); }
        else telaLogin('entrar', ['Cadastro criado. Abra o e-mail que enviamos para confirmar o endereço e depois entre aqui.', 'info']);
      }
      else { await PEX.recuperar(email); telaLogin('entrar', ['Se esse e-mail tiver cadastro, você vai receber um link para criar uma nova senha.', 'info']); }
    }catch(x){ console.warn('PEX auth', x); falha(msgAuth(x)); }
  }
  if(f.id === 'f-senha'){
    e.preventDefault();
    const s = $('#s-nova').value; const err = $('#s-err');
    if(s.length < 8){ err.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; err.hidden = false; return; }
    try{ await PEX.novaSenha(s); history.replaceState(null, '', location.pathname); toast('Senha alterada.'); window.__pexSenhaOk && window.__pexSenhaOk(); }
    catch(x){ err.textContent = msgAuth(x); err.hidden = false; }
  }
  if(f.id === 'f-eventos'){ e.preventDefault(); adicionarEventos(); }
});

function cadastroEventosHtml(evs){

        <textarea id="ev-lista" rows="5" placeholder="Magic Park Mega; GP2; Sim&#10;Dino World; GP1; Não&#10;Neve; GP5"></textarea></label>
      <button class="btn pri block" type="submit" id="btn-ev-add">Adicionar à lista</button>
      <p class="note" style="margin:0">Nomes iguais a um evento já cadastrado são ignorados.</p>

async function adicionarEventos(){
  const linhas = $('#ev-lista').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(!linhas.length){ toast('Digite pelo menos um evento.'); return; }
  const btn = $('#btn-ev-add'); btn.disabled = true;
  let ordem = Math.max(0, ...[...S.eventos.values()].map(e => e.ordem || 0));
  let ok = 0, pulados = 0;
  for(const l of linhas){
    const [nome, franquia, infl] = l.split(';').map(s => (s || '').trim());
    if(!nome){ continue; }
    const id = slug(nome);
    if(!id || S.eventos.has(id)){ pulados++; continue; }
    const inf = /^s/i.test(infl || '') ? true : /^n/i.test(infl || '') ? false : null;
    try{ await S.db.doc('eventos/' + id).set({nome, franquia: franquia || '', inflaveis: inf, ordem: ++ordem}); ok++; }
    catch(e){ toast('Não foi possível adicionar "' + nome + '".'); break; }
  }
  btn.disabled = false;
  toast(`${ok} ${ok === 1 ? 'parque adicionado' : 'parques adicionados'}${pulados ? ` · ${pulados} já existia(m)` : ''}.`);
  if(ok){ S.cfgTab = 'parques'; render(); }
}

function revisaoBody(d){
  const pr = r => r === 'c' ? pill('Conforme','ok') : r === 'nc' ? pill('Não conforme','bad') : r === 'na' ? pill('N/A','') : pill('Sem resposta','warn');
  const linha = (t, dir, extra) => `<div class="rep-it"><span>${t}</span><span>${dir}</span>${extra || ''}</div>`;
  const blocos = STEPS.slice(0, -1).map((s, i) => {
    const ok = stepDone(d, s); const partes = []; let corpo = '';
    if(s.k === 'anonimo'){ const n = nomesAtend(d); corpo += linha('Atendido por', n.length ? `<b>${esc(n.join(', '))}</b>` : pill('Falta o nome','bad')); }
    if(s.special === 'identificacao'){
      partes.push(d.identificadoEm ? 'Identificado às ' + fdt(d.identificadoEm).slice(6) : 'Ainda não se identificou');
      corpo += linha('Identificação', d.identificadoEm ? fdt(d.identificadoEm) : pill('Pendente','bad')) + linha('Líder presente', esc(d.lider || '—'));
    }
    if(s.special === 'estoque'){
      const rows = (d.estoque||[]).filter(r => r.fixo || r.outro || r.sku);
      const contados = rows.filter(r => r.exposto !== '' && r.reserva !== '');
      partes.push(`${contados.length} de ${rows.length} produtos contados`);
      corpo += rows.map(r => { const f = (+r.exposto||0) + (+r.reserva||0); const cont = r.exposto !== '' && r.reserva !== ''; return linha(esc(r.sku || 'Produto sem nome'), cont ? `<b>${f}</b> <span class="muted">(${+r.exposto||0} exp. + ${+r.reserva||0} res.)</span>` : pill('Não contado','bad'), r.just ? `<span class="o">${esc(r.just)}</span>` : ''); }).join('');
    }
    if(s.grupos){
      const its = s.grupos.filter(g => !g.inflaveis || d.temInflaveis).flatMap(g => g.itens);
      const n = k => its.filter(x => (d.itens[x.id]||{}).r === k).length; const sem = its.length - n('c') - n('nc') - n('na');
      partes.push(`${n('c')} conforme · ${n('nc')} não conforme · ${n('na')} N/A${sem ? ` · ${sem} sem resposta` : ''}`);
      corpo += its.map(x => { const a = d.itens[x.id] || {}; return linha(x.t, pr(a.r), `${a.obs ? `<span class="o">${esc(a.obs)}</span>` : ''}${(a.fotos||[]).length ? `<span class="o">${a.fotos.length} foto(s)</span>` : ''}`); }).join('');
    }
    if(s.fotos){
      const f = s.fotos.filter(([id]) => (d.fotosObr[id]||[]).length).length; partes.push(`fotos ${f}/${s.fotos.length}`);
      corpo += s.fotos.map(([id, t]) => linha(t, (d.fotosObr[id]||[]).length ? pill((d.fotosObr[id]).length + ' foto(s)','ok') : pill('Falta foto','bad'))).join('');
    }
    if(s.extras){
      const ex = ((d.extras||{})[s.k]) || [];
      if(ex.length){ partes.push(`${ex.length} outro(s) local(is)`); corpo += ex.map(x => linha('Outro local: ' + esc(x.local || 'sem nome'), pr(x.r), `${x.obs ? `<span class="o">${esc(x.obs)}</span>` : ''}<span class="o">${(x.fotos||[]).length} foto(s)</span>`)).join(''); }
    }
    if(s.eixo){
      const nt = d.notas[s.eixo] || {}; const lb = EIXOS.find(e => e[0] === s.eixo)[1];
      partes.push(`nota ${nt.n == null ? '—' : nt.n === 'na' ? 'N/A' : nt.n}`);
      corpo += linha('Nota de ' + lb, nt.n == null ? pill('Sem nota','bad') : `<b>${nt.n === 'na' ? 'N/A' : nt.n + ' · ' + ESCALA[nt.n]}</b>`, `<span class="o">${nt.j ? esc(nt.j) : '<b style="color:var(--bad)">Falta a justificativa</b>'}</span>`);
    }
    if(s.special === 'ocorrencias'){
      const ocs = d.ocorrencias || [];
      partes.push(ocs.length ? `${ocs.length} ocorrência(s)` + (ocs.some(o => o.crit === 'critica') ? ` · ${ocs.filter(o => o.crit === 'critica').length} crítica(s)` : '') : 'Nenhuma ocorrência');
      corpo += ocs.map((o, k) => linha(`${esc(d.codigo)}-O${k+1} · ${esc(CATEG[o.eixo] || o.eixo)}`, pill(CRIT[o.crit][0], CRIT[o.crit][1]), `<span class="o">${esc(o.local || 'sem local')} — ${esc(o.desc || 'sem descrição')}${o.colab ? ` · colaboradora: ${esc(o.colab)}` : ''}</span>`)).join('') || '<p class="note">Nenhuma ocorrência registrada.</p>';
    }
    return `<details class="fold rev${ok ? '' : ' pend'}"><summary><span class="num">${ok ? '✓' : '!'}</span><span style="min-width:0;flex:1">${i+1}. ${s.t}<small>${partes.join(' · ')}</small></span>${ic('down')}</summary>
      <div class="fold-b">${corpo}<div style="margin-top:10px"><button type="button" class="btn sm" data-act="step" data-i="${i}">${ic('left','sm')}Voltar para esta etapa</button></div></div></details>`;
  });
  return `<div><div class="grp-t">Revise o que você registrou</div>
    <p class="note" style="margin:-4px 0 10px">Toque em cada etapa para conferir tudo o que foi preenchido. As marcadas com <b style="color:var(--bad)">!</b> têm algo faltando.</p>
    <div class="stack tight">${blocos.join('')}</div></div>`;
}

function ehTablet(){ return innerWidth >= 768 && innerWidth < 1024; }

const AC_ST = {aberta:['Aberta','warn'], em_andamento:['Em andamento','info'], aguardando_validacao:['Aguardando validação','brand'], concluida:['Concluída','ok'], reaberta:['Reaberta','bad']};
const DEPS = {lider:'Líder do evento', compras:'Compras', operacoes:'Operações', manutencao:'Manutenção', gestao:'Gestão PEX'};
const AC_PAG = 15;
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; };
const acCod = a => 'AC-' + String(a.numero || 0).padStart(4, '0');
const acAtrasada = a => ['aberta','em_andamento','reaberta'].includes(a.status) && a.prazo && a.prazo < hojeISO();
const acAbertaSt = a => a.status !== 'concluida';
function acaoDaOc(vid, ocId){ for(const a of S.acoes.values()) if(a.visita === vid && a.ocorrencia === ocId) return a; return null; }
function acPill(a){ return pill(AC_ST[a.status][0], AC_ST[a.status][1]) + (acAtrasada(a) ? pill('Atrasada', 'bad') : ''); }

async function carregarAcoes(){
  if(!S.me.admin) return;
  try{ const l = await PEX.acoes.listar(); S.acoes = new Map(l.map(a => [a.id, a])); S.loaded.ac = true; contarAcoes(); refresh(true); }
  catch(e){ S.acErro = true; if(S.tab === 'pendencias') render(); }
}
function contarAcoes(){
  const l = [...S.acoes.values()];
  const n = l.filter(a => acAtrasada(a) || a.status === 'aguardando_validacao').length;
  setCt('ct-pend', n, S.me.admin && n);
}
function acFiltradas(){
  const f = S.pf; const q = (f.q || '').toLowerCase();
  return [...S.acoes.values()].filter(a => {
    if(q && !(acCod(a) + ' ' + a.problema + ' ' + a.local + ' ' + a.responsavel + ' ' + evName(a.evento)).toLowerCase().includes(q)) return false;
    if(f.parque && a.evento !== f.parque) return false;
    if(f.status === 'abertas' && !['aberta','reaberta'].includes(a.status)) return false;
    if(f.status === 'atrasadas' && !acAtrasada(a)) return false;
    if(f.status === 'criticas' && !(a.criticidade === 'critica' && acAbertaSt(a))) return false;
    if(f.status && !['abertas','atrasadas','criticas'].includes(f.status) && a.status !== f.status) return false;
    if(f.crit && a.criticidade !== f.crit) return false;
    if(f.dep && (f.dep === 'sem' ? a.departamento : a.departamento !== f.dep)) return false;
    if(f.resp && (f.resp === 'sem' ? a.responsavel : a.responsavel !== f.resp)) return false;
    if(f.origem === 'manual' && a.visita) return false;
    if(f.origem && f.origem !== 'manual' && a.visita !== f.origem) return false;
    if(f.de && a.identificado_em < f.de) return false;
    if(f.ate && a.identificado_em > f.ate) return false;
    return true;
  });
}
function acOrdenar(l){
  const {col, dir} = S.psort; const crit = {critica:0, alta:1, media:2, baixa:3}; const st = {reaberta:0, aberta:1, em_andamento:2, aguardando_validacao:3, concluida:4};
  const val = a => col === 'numero' ? a.numero : col === 'parque' ? evName(a.evento) : col === 'crit' ? crit[a.criticidade] : col === 'dep' ? (DEPS[a.departamento] || 'zz') : col === 'resp' ? (a.responsavel || 'zz') : col === 'prazo' ? (a.prazo || '9999') : col === 'status' ? st[a.status] : col === 'criada' ? a.criado_em : a.problema;
  return l.sort((x, y) => { if(col === 'crit'){ const fx = x.status === 'concluida' ? 1 : 0, fy = y.status === 'concluida' ? 1 : 0; if(fx !== fy) return fx - fy; } const a = val(x), b = val(y); const r = typeof a === 'number' ? a - b : String(a).localeCompare(String(b), 'pt-BR', {numeric: true}); return (r * dir) || String(x.prazo || '9999').localeCompare(String(y.prazo || '9999')) || x.numero - y.numero; });
}

function valHist(c, v){ if(v == null || v === '') return '—'; if(c === 'departamento') return DEPS[v] || v; if(c === 'criticidade') return (CRIT[v] || [v])[0]; if(c === 'eixo') return CATEG[v] || v; if(c === 'prazo') return fiso(v); return v; }

function preDaOcorrencia(vid, ocId){

async function criarAcoesDaVisita(vid){

// Mesma regra da função pex_nc_pendentes do banco.
function ncDaVisita(v){
  const out = [];
  STEPS.forEach(s => (s.grupos || []).forEach(g => g.itens.forEach(i => {
    const a = (v.itens || {})[i.id];
    if(a && a.r === 'nc' && (!i.id.startsWith('if-') || v.temInflaveis)) out.push({chave: 'item:' + i.id, item: i.id, titulo: i.t, etapa: s.t, obs: a.obs || '', fotos: a.fotos || [], eixo: s.eixo || 'organizacao', crit: s.k === 'estrutura' ? 'alta' : 'media'});
  })));
  const ex = v.extras && typeof v.extras === 'object' && !Array.isArray(v.extras) ? v.extras : {};
  Object.entries(ex).forEach(([k, arr]) => (Array.isArray(arr) ? arr : []).forEach(x => {
    if(x.r === 'nc'){ const s = STEPS.find(z => z.k === k) || {}; out.push({chave: 'ext:' + x.id, item: 'ext:' + x.id, titulo: 'Outro local: ' + (x.local || 'sem nome'), etapa: s.t || '', obs: x.obs || '', fotos: x.fotos || [], eixo: s.eixo || 'organizacao', crit: k === 'estrutura' ? 'alta' : 'media'}); }
  }));
  (v.ocorrencias || []).forEach(o => { if(!o.item && !o.ext) out.push({chave: 'oc:' + o.id, oc: o.id, titulo: o.desc || 'Ocorrência sem descrição', etapa: 'Ocorrências', obs: o.local || '', fotos: o.fotos || [], eixo: o.eixo, crit: o.crit || 'media'}); });
  return out;
}
function coberturaNc(v, n){
  for(const a of S.acoes.values()){ if(a.visita === v._id && ((n.item && a.item === n.item) || (n.oc && a.ocorrencia === n.oc))) return {acao: a}; }
  const w = S.rep && S.rep.id === v._id ? S.rep.w : (S.val.get(v._id) || {});
  const j = (w.justificativas || {})[n.chave]; if(j && (j.texto || '').trim()) return {just: j};
  return null;
}
function ncPendentes(v){ return ncDaVisita(v).filter(n => !coberturaNc(v, n)); }
function preDaNc(vid, chave){
  const v = S.visitas.get(vid); if(!v) return null; const n = ncDaVisita(v).find(x => x.chave === chave); if(!n) return null;
  const oc = (v.ocorrencias || []).find(o => (n.item && (o.item === n.item || (o.ext && 'ext:' + o.ext === n.item))) || (n.oc && o.id === n.oc));
  if(oc) return preDaOcorrencia(vid, oc.id);
  return {evento: v.evento, visita: vid, ocorrencia: null, item: n.item || null, origem: 'nao_conformidade', problema: n.titulo + (n.obs ? ': ' + n.obs : ''), local: '', eixo: n.eixo || null, criticidade: n.crit, acao: '', fotos: n.fotos, identificado_em: v.enviadoEm ? new Date(v.enviadoEm).toISOString().slice(0, 10) : hojeISO()};
}
function ncSecao(v){

const HEAT = ['#B4281F','#D9644F','#F1B6A8','#ECEBE8','#9DC4E6','#2F6FB0']; // 0..5 · divergente vermelho↔azul, 3 = neutro
const HEAT_TXT = ['#fff','#fff','#14201C','#14201C','#14201C','#fff'];
const DIA = 864e5;
const diasDesde = ms => ms ? Math.floor((Date.now() - ms) / DIA) : null;
function dashDados(){
  const f = S.df || {}; const de = f.de ? new Date(f.de + 'T00:00:00').getTime() : 0; const ate = f.ate ? new Date(f.ate + 'T23:59:59').getTime() : Infinity;
  const evs = [...S.eventos.entries()].map(([id, e]) => ({id, ...e})).filter(e => (!f.socio || (f.socio === 'sem' ? !e.franquia : e.franquia === f.socio)) && (!f.parque || e.id === f.parque));
  const evIds = new Set(evs.map(e => e.id));
  const auds = submetidas().filter(v => evIds.has(v.evento) && v.enviadoEm >= de && v.enviadoEm <= ate && (!f.auditor || v.auditor === f.auditor));
  const porParque = new Map(); auds.forEach(v => { if(!porParque.has(v.evento)) porParque.set(v.evento, []); porParque.get(v.evento).push(v); });
  porParque.forEach(l => l.sort((a, b) => a.enviadoEm - b.enviadoEm));
  let linhas = evs.map(e => { const l = porParque.get(e.id) || []; const u = l[l.length - 1]; const ant = l[l.length - 2];
    const acs = [...S.acoes.values()].filter(a => a.evento === e.id);
    return {e, u, ant, n: l.length, idx: u ? indice(u) : null, idxAnt: ant ? indice(ant) : null, sit: u ? situacao(u) : 'Sem auditoria',
      pend: acs.filter(acAbertaSt).length, crit: acs.filter(a => a.criticidade === 'critica' && acAbertaSt(a)).length + (u ? (u.ocorrencias || []).filter(o => o.crit === 'critica' && !acaoDaOc(u._id, o.id) && ocAberta(u._id, o)).length : 0)}; });
  if(f.sit) linhas = linhas.filter(r => r.sit === f.sit);
  let acoes = [...S.acoes.values()].filter(a => evIds.has(a.evento));
  if(f.dep) acoes = acoes.filter(a => f.dep === 'sem' ? !a.departamento : a.departamento === f.dep);
  return {f, evs, auds, porParque, linhas, acoes};
}

function rankingHtml(D){

    </section></div>`;

function lineSvg(pts, rotulo){
  const W = 560, H = 220, L = 34, R = 12, T = 12, B = 30;
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x; const sx = x => pts.length === 1 ? (L + (W - L - R) / 2) : L + (x - x0) / (x1 - x0) * (W - L - R); const sy = y => T + (5 - y) / 5 * (H - T - B);
  const grid = [0,1,2,3,4,5].map(g => `<line x1="${L}" x2="${W - R}" y1="${sy(g)}" y2="${sy(g)}" class="${g === 3 ? 'ref' : 'gl'}"/><text x="${L - 8}" y="${sy(g) + 4}" class="ax" text-anchor="end">${g}</text>`).join('');
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
  const lbl = [pts[0], pts[pts.length - 1]].filter((p, i, a) => i === 0 || p !== a[0]).map((p, i) => `<text x="${sx(p.x)}" y="${H - 8}" class="ax" text-anchor="${pts.length === 1 ? 'middle' : i ? 'end' : 'start'}">${fd(p.x)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="ln" role="img" aria-label="${esc(rotulo || 'Evolução do índice PEX')}">${grid}<path d="${path}" class="ln-p"/>${pts.map(p => `<g class="pt"><circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="12" class="hit"/><circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="4.5" class="dot"/><title>${esc(p.t)}: índice ${nf1(p.y)}</title></g>`).join('')}${lbl}</svg>`;
}
function fotosDaVisita(v){
  const fs = []; const add = (ids, origem) => (ids || []).forEach(id => fs.push({id, origem}));
  Object.entries(v.fotosObr || {}).forEach(([k, ids]) => add(ids, FOTO_INDEX[k] || 'Foto obrigatória'));
  Object.entries(v.itens || {}).forEach(([k, a]) => add(a.fotos, (ITEM_INDEX[k] || {}).t || 'Item'));
  Object.values(v.extras && typeof v.extras === 'object' ? v.extras : {}).forEach(arr => (Array.isArray(arr) ? arr : []).forEach(x => add(x.fotos, 'Outro local: ' + (x.local || ''))));
  (v.estoque || []).forEach(r => add(r.fotos, 'Estoque: ' + (r.sku || '')));
  (v.ocorrencias || []).forEach(o => add(o.fotos, 'Ocorrência'));
  const vistos = new Set(); return fs.filter(f => !vistos.has(f.id) && vistos.add(f.id));
}
function ncSet(v){ return new Set(Object.entries(v.itens || {}).filter(([k, a]) => a.r === 'nc').map(([k]) => k)); }
function compararAuditorias(atual, ant){
  const a = ncSet(atual), b = ncSet(ant);
  return {eixos: EIXOS.map(([k, t]) => ({k, t, ant: notaN(ant, k), at: notaN(atual, k)})),
    resolvidos: [...b].filter(x => !a.has(x)), reincidentes: [...a].filter(x => b.has(x)), novos: [...a].filter(x => !b.has(x)),
    ocNovas: (atual.ocorrencias || []).length, idxAnt: indice(ant), idxAt: indice(atual)};
}

async function timelineParque(id, auds, acs){
  const ev = [];
  auds.forEach(v => { ev.push({em: v.enviadoEm, ic: 'visitas', t: `Auditoria <b>${esc(v.codigo)}</b> enviada por ${esc(quem(v))} · índice ${nf1(indice(v))}`});
    const w = S.val.get(v._id) || {}; (w.hist || []).forEach(h => ev.push({em: h.em, ic: 'validacao', t: `${esc(v.codigo)}: ${esc(ST[h.s] ? ST[h.s][0] : h.s === 'justificativa' ? 'justificativa registrada' : h.s)}${h.obs ? ' — ' + esc(h.obs) : ''}`}));
    (v.ocorrencias || []).forEach(o => { if(o.crit === 'critica') ev.push({em: v.enviadoEm + 1, ic: 'alerta', t: `Ocorrência crítica: ${esc(o.desc || '')}`, cls: 'bad'}); }); });
  let hs = []; if(acs.length){ try{ hs = await PEX.acoes.historicoVarios(acs.map(a => a.id)); }catch(e){} }
  const porId = new Map(acs.map(a => [a.id, a]));
  if(hs.length) hs.forEach(h => { const a = porId.get(h.acao_id); if(!a) return; const cod = acCod(a);
    if(h.tipo === 'criada') ev.push({em: new Date(h.em).getTime(), ic: 'flag', t: `Ação <b>${cod}</b> criada: ${esc(a.problema)}`});
    else if(h.tipo === 'status') ev.push({em: new Date(h.em).getTime(), ic: h.para === 'concluida' ? 'check' : h.para === 'reaberta' ? 'x' : 'pend', cls: h.para === 'concluida' ? 'ok' : h.para === 'reaberta' ? 'bad' : '',
      t: `${cod}: ${h.para === 'concluida' ? 'correção aprovada' : h.para === 'reaberta' ? (h.de === 'aguardando_validacao' ? 'correção rejeitada' : 'ação reaberta') : h.para === 'aguardando_validacao' ? 'correção informada' : 'em andamento'}${h.texto ? ' — “' + esc(h.texto) + '”' : ''}`}); });
  else acs.forEach(a => ev.push({em: new Date(a.criado_em).getTime(), ic: 'flag', t: `Ação <b>${acCod(a)}</b> criada: ${esc(a.problema)}`}));
  const el = $('#tl-parque'); if(!el || S.parque !== id) return;
  el.innerHTML = ev.sort((a, b) => b.em - a.em).slice(0, 60).map(x => `<div class="tl-i ${x.cls || ''}"><span class="tl-d">${ic(x.ic, 'sm')}</span><div><div>${x.t}</div><span class="note" style="margin:0">${fdt(x.em)}</span></div></div>`).join('') || '<p class="note">Sem eventos.</p>';
}

function abrirImpressao(titulo){
  const w = window.open('', '_blank'); if(!w){ toast('O navegador bloqueou a janela do relatório. Permita pop-ups para este site.', 'bad'); return null; }
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${PDF_CSS}</style></head><body><p class="meta">Preparando o relatório…</p></body></html>`); w.document.close();
  return w;
}
async function finalizarImpressao(w, html){
  w.document.body.innerHTML = html;
  const imgs = [...w.document.querySelectorAll('img[data-fid]')];
  await Promise.all(imgs.map(async im => { const u = await PEX.urlDe(im.dataset.fid); if(u){ im.src = u; await new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 8000); }); } else im.closest('figure') && im.closest('figure').remove(); }));
  setTimeout(() => { w.focus(); w.print(); }, 300);
}
function cabecalhoPdf(titulo, sub){
  return `<div class="cab"><div class="marca"><div class="mk">PEX</div><div><b>Plataforma PEX</b><div class="meta">Evento Kids · Programa de Excelência e Auditoria</div></div></div><div style="text-align:right"><h1>${esc(titulo)}</h1><div class="meta">${sub}</div></div></div>`;
}

function pdfGerencial(de, ate){

  const media = idxs.length ? idxs.reduce((a, b) => a + b, 0) / idxs.length : null;

    <h2>Melhores desempenhos</h2><table><tr><th>Parque</th><th class="r">Índice</th><th>Última auditoria</th><th>Situação</th></tr>${ordem.slice(0, 5).map(r => `<tr><td>${esc(r.e.nome)}</td><td class="r"><b>${nf1(r.idx)}</b></td><td>${fd(r.u.enviadoEm)}</td><td>${tagSt(r.sit, sitCls(r.sit))}</td></tr>`).join('') || '<tr><td colspan="4">Sem auditorias.</td></tr>'}</table>
    <h2>Piores desempenhos</h2><table><tr><th>Parque</th><th class="r">Índice</th><th>Última auditoria</th><th>Situação</th><th class="r">Ações abertas</th></tr>${ordem.slice().reverse().slice(0, 5).map(r => `<tr><td>${esc(r.e.nome)}</td><td class="r"><b>${nf1(r.idx)}</b></td><td>${fd(r.u.enviadoEm)}</td><td>${tagSt(r.sit, sitCls(r.sit))}</td><td class="r">${r.pend}</td></tr>`).join('') || '<tr><td colspan="5">Sem auditorias.</td></tr>'}</table>
    <h2>Índice por parque</h2><table><tr><th>Parque</th><th>Sócio</th>${EIXOS.map(([k, t]) => `<th class="r">${t}</th>`).join('')}<th class="r">Índice</th></tr>${ordem.map(r => `<tr><td>${esc(r.e.nome)}</td><td>${esc(r.e.franquia || '')}</td>${EIXOS.map(([k]) => `<td class="r">${notaN(r.u, k) ?? '—'}</td>`).join('')}<td class="r"><b>${nf1(r.idx)}</b></td></tr>`).join('')}</table>
    <h2>Problemas mais recorrentes</h2><table><tr><th>Item</th><th class="r">Vezes reprovado</th></tr>${top.map(([k, n]) => `<tr><td>${esc(ITEM_INDEX[k].t)}</td><td class="r">${n}</td></tr>`).join('') || '<tr><td colspan="2">Nenhuma não conformidade no período.</td></tr>'}</table>

    <h2>Ações em aberto</h2><table><tr><th>Ação</th><th>Parque</th><th>Problema</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr>${acs.filter(acAbertaSt).sort((a, b) => String(a.prazo || '9').localeCompare(String(b.prazo || '9'))).map(a => `<tr><td>${acCod(a)}</td><td>${esc(evName(a.evento))}</td><td>${esc(a.problema)}</td><td>${esc(a.responsavel || '—')}</td><td>${a.prazo ? fiso(a.prazo) : '—'}</td><td>${tagSt(AC_ST[a.status][0], AC_ST[a.status][1])}${acAtrasada(a) ? ' ' + tagSt('Atrasada', 'bad') : ''}</td></tr>`).join('') || '<tr><td colspan="6">Nenhuma.</td></tr>'}</table>
    <div class="rod">Relatório gerado pela Plataforma PEX em ${fdt(Date.now())} por ${esc((S.perfil || {}).nome || '')}. Índices consideram a auditoria mais recente de cada parque dentro do período.</div>`;
  finalizarImpressao(w, html);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act;
  if(a === 'parque-abrir'){ if(ev.target.closest('input,select')) return; S.parque = b.dataset.id; if(S.tab !== 'parques'){ S.manterParque = true; go('parques'); } else { renderParques(); window.scrollTo(0, 0); } }
  else if(a === 'parque-voltar'){ S.parque = null; renderParques(); window.scrollTo(0, 0); }
  else if(a === 'parque-acoes'){ S.pf = {parque: b.dataset.id}; S.ppage = 1; go('pendencias'); }
  else if(a === 'pdf-aud'){ pdfAuditoria(b.dataset.id); }
  else if(a === 'rel-gerencial'){ go('relatorios'); }
  else if(a === 'rg-gerar'){ pdfGerencial($('#rg-de').value, $('#rg-ate').value); }
  else if(a === 'ra-gerar'){ const v = $('#ra-v').value; if(v) pdfAuditoria(v); }
  else if(a === 'mais'){ maisSheet(); }
  else if(a === 'mais-ir'){ fecharSheet(); go(b.dataset.v); }
});

async function abrirNotif(id){
  const n = (S.notifs || []).find(x => String(x.id) === String(id)); if(!n) return;
  if(!n.lida_em){ n.lida_em = new Date().toISOString(); contarNotif(); PEX.notif.marcar([n.id]).catch(() => {}); }
  if(n.alvo_tipo === 'visita' && S.visitas.get(n.alvo_id)){ const v = S.visitas.get(n.alvo_id); if(editavel(v)) openEditor(n.alvo_id, v); else openReport(n.alvo_id); }
  else if(n.alvo_tipo === 'acao' && S.me.admin){ go('pendencias'); setTimeout(() => { if(S.acoes.get(n.alvo_id)) acaoSheet(n.alvo_id); }, 150); }
  else renderNotificacoes();
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act;
  if(a === 'notif-abrir') abrirNotif(b.dataset.id);
  else if(a === 'nfilt'){ S.nfilt = b.dataset.v; renderNotificacoes(); }
  else if(a === 'notif-todas'){ (S.notifs || []).forEach(n => { if(!n.lida_em) n.lida_em = new Date().toISOString(); }); contarNotif(); renderNotificacoes(); PEX.notif.marcar(null).then(() => toast('Todas marcadas como lidas.', 'ok')).catch(() => toast('Não foi possível marcar. Tente de novo.', 'bad')); }
});


/* ===================== Fase 6 · Indicador de conexão e sincronização ===================== */
function textoNet(e){
  if(!e.online) return ['off', e.pendentes ? `Offline · ${e.pendentes} pendente(s)` : 'Offline'];
  if(e.sincronizando) return ['sync', 'Sincronizando…'];
  if(e.erro) return ['err', 'Erro de sincronização'];
  if(e.pendentes) return ['pend', `${e.pendentes} alteração(ões) pendente(s)`];
  return ['ok', e.ultimo ? 'Sincronizado' : 'Online'];
}
PEX.offline && PEX.offline.assinar(e => {
  const [cls, t] = textoNet(e); S.net = e;
  document.querySelectorAll('.net').forEach(b => { b.dataset.st = cls; b.querySelector('.net-t').textContent = t; b.title = t; b.dataset.tip = t; });
  if(S.edit && !e.online) setSaved(e.pendentes ? 'Salvo no aparelho' : 'Offline');
});
PEX.offline && PEX.offline.aoRemapear((id, mapa) => {
  const troca = x => typeof x === 'string' ? (mapa[x] || x) : Array.isArray(x) ? x.map(troca) : x && typeof x === 'object' ? Object.fromEntries(Object.entries(x).map(([k, v]) => [k, troca(v)])) : x;
  if(S.edit && S.edit.id === id) S.edit.d = troca(S.edit.d);
});
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act="net"]'); if(!b) return;
  const e = PEX.offline.estado();
  if(!e.online){ toast(e.pendentes ? `Sem internet. ${e.pendentes} auditoria(s) guardada(s) no aparelho serão enviadas quando a conexão voltar.` : 'Sem internet. Você pode continuar preenchendo; tudo fica guardado no aparelho.'); return; }
  toast('Sincronizando…'); const r = await PEX.offline.sincronizar();
  toast(r.erro ? 'Erro de sincronização: ' + r.erro : r.pendentes ? `${r.pendentes} alteração(ões) ainda pendente(s).` : 'Tudo sincronizado.', r.erro ? 'bad' : 'ok');
});

init();
</script>
